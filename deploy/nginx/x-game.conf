# ============================================================
# X-Game API 独立反向代理配置
# 域名: game-api.xtrader.dev
# 端口: 8443 (绕过国内备案端口限制)
# ============================================================

upstream xgame_backend {
    server 127.0.0.1:3001;
    keepalive 32;
}

server {
    listen 8443 ssl http2;
    server_name game-api.xtrader.dev;

    # 请确保这里的证书路径正确，如果和原有的一样，直接复用路径即可
    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL_XGAME:10m;
    ssl_session_timeout 10m;

    # ─── CORS 跨域配置 ───
    add_header Access-Control-Allow-Origin "https://game.xtrader.dev" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "DNT, User-Agent, X-Requested-With, If-Modified-Since, Cache-Control, Content-Type, Range, Authorization" always;
    add_header Access-Control-Allow-Credentials "true" always;

    # OPTIONS 预检请求直接返回 204
    if ($request_method = OPTIONS) {
        return 204;
    }

    # ─── API & WebSocket 统一反代 ───
    location /api/ {
        proxy_pass http://xgame_backend;
        
        # 传递真实 IP
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket 支持 (保持长连接)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # 超时时间设置 (WebSocket PK 需要较长存活时间)
        proxy_connect_timeout 5s;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # 其余未匹配路径拦截
    location / {
        return 444;
    }
}
