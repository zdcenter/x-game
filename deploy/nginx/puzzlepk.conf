# ============================================================
# Puzzle Pk API 反向代理配置
# 域名: api.puzzlepk.com  端口: 8443
# 前端由 Cloudflare Pages 托管，nginx 仅负责 API 代理
# ============================================================

upstream xgame_backend {
    server 127.0.0.1:3001;
    keepalive 32;
}

server {
    listen 8443 ssl http2;
    server_name api.puzzlepk.com;

    ssl_certificate     /etc/nginx/ssl/puzzlepk/fullchain.cer;
    ssl_certificate_key /etc/nginx/ssl/puzzlepk/puzzlepk.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL_XGAME:10m;
    ssl_session_timeout 10m;

    # ─── 还原真实客户端 IP (Cloudflare 节点网段) ───
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    # ─── API & WebSocket 反代 ───
    location /api/ {
        # OPTIONS 预检：CORS 头必须写在 if 块内部，否则 nginx 不会带上
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin      "https://www.puzzlepk.com";
            add_header Access-Control-Allow-Methods     "GET, POST, PUT, PATCH, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers     "DNT, User-Agent, X-Requested-With, If-Modified-Since, Cache-Control, Content-Type, Range, Authorization, x-skip-logout";
            add_header Access-Control-Allow-Credentials "true";
            add_header Access-Control-Max-Age           86400;
            add_header Content-Length                   0;
            return 204;
        }

        # 实际请求的 CORS 头
        add_header Access-Control-Allow-Origin      "https://www.puzzlepk.com" always;
        add_header Access-Control-Allow-Credentials "true" always;

        proxy_pass http://xgame_backend;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP  $http_cf_connecting_ip;

        # WebSocket 支持
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout  5s;
        proxy_read_timeout    86400s;
        proxy_send_timeout    86400s;
    }

    # 其余路径拦截
    location / {
        return 444;
    }
}
