# ============================================================
# Puzzle Pk API 独立反向代理配置
# 域名: game-api.xtrader.dev
# 端口: 8443 (绕过国内备案端口限制)
# ============================================================

upstream xgame_backend {
    server 127.0.0.1:3001;
    keepalive 32;
}

server {
    listen 8443 ssl http2;
    server_name api.puzzlepk.com;

    # 请确保这里的证书路径正确，如果和原有的一样，直接复用路径即可
    ssl_certificate     /etc/nginx/ssl/puzzlepk/fullchain.cer;
    ssl_certificate_key /etc/nginx/ssl/puzzlepk/puzzlepk.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL_XGAME:10m;
    ssl_session_timeout 10m;

    # ─── CORS 跨域配置 ───
    add_header Access-Control-Allow-Origin "https://www.puzzlepk.com" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "DNT, User-Agent, X-Requested-With, If-Modified-Since, Cache-Control, Content-Type, Range, Authorization, x-skip-logout" always;
    add_header Access-Control-Allow-Credentials "true" always;

    # OPTIONS 预检请求直接返回 204
    if ($request_method = OPTIONS) {
        return 204;
    }


    # ─── API & WebSocket 统一反代 ───
    location /api/ {
        proxy_pass http://xgame_backend;
        
        # 传递真实 IP
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket 支持 (保持长连接)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # 超时时间设置 (WebSocket PK 需要较长存活时间)
        proxy_connect_timeout 5s;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # 其余未匹配路径拦截
    location / {
        return 444;
    }
}

# ============================================================
# Puzzle Pk 前端多语言静态部署配置 (Frontend)
# 域名: www.puzzlepk.com, puzzlepk.com
# 端口: 80, 443
# ============================================================
server {
    listen 80;
    listen 443 ssl http2;
    server_name www.puzzlepk.com puzzlepk.com;

    # SSL 证书配置 (与 API 复用)
    ssl_certificate     /etc/nginx/ssl/puzzlepk/fullchain.cer;
    ssl_certificate_key /etc/nginx/ssl/puzzlepk/puzzlepk.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # 强制 HTTP 跳转 HTTPS
    if ($scheme = http) {
        return 301 https://$host$request_uri;
    }

    # ⚠️ 请将此处替换为您的 Angular build 产物所在的真实绝对路径
    # 例如: /home/zd/x-game/frontend/dist/frontend/browser
    set $frontend_root /home/zd/x-game/frontend/dist/frontend/browser;

    # 1. 根目录 ( / ) 智能嗅探重定向
    location = / {
        set $lang "en";
        # 如果浏览器首选语言是中文，则设为 zh
        if ($http_accept_language ~* "^zh") {
            set $lang "zh";
        }
        # 301 永久重定向到对应语言的大厅
        return 301 /$lang/lobby;
    }

    # 1.5 根目录静态文件放行 (支持 public 目录下的所有常见文件，避免重定向)
    # 匹配根目录下任意带有后缀的文件 (如 .txt, .xml, .ico, .html 等)
    location ~* ^/[^/]+\.(txt|xml|ico|svg|webmanifest|html|png|jpg|json)$ {
        root $frontend_root/en;
        try_files $uri =404;
    }

    # 1.6 共享静态资源 (/assets/) 放行，直接返回文件，避免因为 301 重定向导致加载延迟或错误
    location /assets/ {
        alias $frontend_root/en/assets/;
        expires 1y;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # 2. 中文版 (/zh/) 静态文件与 SPA 路由回退
    location /zh/ {
        alias $frontend_root/zh/;
        # 尝试寻找静态文件，找不到则统一交给 /zh/index.html (Angular 路由)
        try_files $uri $uri/ /zh/index.html;
    }

    # 3. 英文版 (/en/) 静态文件与 SPA 路由回退
    location /en/ {
        alias $frontend_root/en/;
        try_files $uri $uri/ /en/index.html;
    }

    # 4. 兜底策略：如果用户直接访问 /lobby (不带语言前缀)，自动嗅探并补全
    location / {
        set $lang "en";
        if ($http_accept_language ~* "^zh") {
            set $lang "zh";
        }
        return 301 /$lang$request_uri;
    }
}
