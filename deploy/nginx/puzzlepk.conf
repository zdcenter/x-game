# ============================================================
# Puzzle Pk API 反向代理配置
# 域名: api.puzzlepk.com  端口: 8443
# 前端由 Cloudflare Pages 托管，nginx 仅负责 API 代理
# ============================================================

upstream xgame_backend {
    server 127.0.0.1:3001;
    keepalive 32;
}

server {
    listen 8443 ssl http2;
    server_name api.puzzlepk.com;

    ssl_certificate     /etc/nginx/ssl/puzzlepk/fullchain.cer;
    ssl_certificate_key /etc/nginx/ssl/puzzlepk/puzzlepk.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL_XGAME:10m;
    ssl_session_timeout 10m;

    # ─── CORS ───
    add_header Access-Control-Allow-Origin  "https://www.puzzlepk.com" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "DNT, User-Agent, X-Requested-With, If-Modified-Since, Cache-Control, Content-Type, Range, Authorization, x-skip-logout" always;
    add_header Access-Control-Allow-Credentials "true" always;

    if ($request_method = OPTIONS) {
        return 204;
    }

    # ─── API & WebSocket 反代 ───
    location /api/ {
        proxy_pass http://xgame_backend;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 支持
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout  5s;
        proxy_read_timeout    86400s;
        proxy_send_timeout    86400s;
    }

    # 其余路径拦截
    location / {
        return 444;
    }
}
