      try {
        var savedTheme = localStorage.getItem('theme');
        var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var isDark = savedTheme === 'dark' || (!savedTheme && prefersDark);
        var metaTheme = document.querySelector('meta[name="theme-color"]');
        if (isDark) {
          document.documentElement.classList.add('theme-dark');
          document.documentElement.style.backgroundColor = '#0b1120';
          if (metaTheme) metaTheme.setAttribute('content', '#0b1120');
        } else {
          document.documentElement.style.backgroundColor = '#f8fafc';
          if (metaTheme) metaTheme.setAttribute('content', '#f8fafc');
        }
      } catch (e) {}

      // 3. 动态模块与 ChunkLoadError 自愈容错
      function handleChunkError(errStr) {
        var lower = (errStr || '').toLowerCase();
        if (
          lower.indexOf('loading chunk') !== -1 ||
          lower.indexOf('failed to fetch dynamically imported module') !== -1 ||
          lower.indexOf('importing a module script failed') !== -1
        ) {
          console.warn('[PWA Shield] Recovering from chunk load error:', lower);
          var lastRecover = sessionStorage.getItem('pwa_chunk_recover_ts');
          var now = Date.now();
          if (!lastRecover || (now - parseInt(lastRecover, 10)) > 8000) {
            sessionStorage.setItem('pwa_chunk_recover_ts', now.toString());
            if ('caches' in window) {
              caches.keys().then(function(keys) {
                return Promise.all(keys.map(function(k) { return caches.delete(k); }));
              }).finally(function() {
                window.location.reload();
              });
            } else {
              window.location.reload();
            }
          }
        }
      }

      window.addEventListener('error', function(e) {
        var msg = e.message || (e.error && e.error.message) || '';
        handleChunkError(msg);
