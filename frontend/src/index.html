          var lastRecover = sessionStorage.getItem('pwa_chunk_recover_ts');
          var now = Date.now();
          if (!lastRecover || (now - parseInt(lastRecover, 10)) > 8000) {
            sessionStorage.setItem('pwa_chunk_recover_ts', now.toString());
            if ('caches' in window) {
              caches.keys().then(function(keys) {
                return Promise.all(keys.map(function(k) { return caches.delete(k); }));
              }).finally(function() {
                window.location.reload();
              });
            } else {
              window.location.reload();
            }
          }
        }
      }

      window.addEventListener('error', function(e) {
        var msg = e.message || (e.error && e.error.message) || '';
        handleChunkError(msg);
      }, true);

      window.addEventListener('unhandledrejection', function(e) {
        var reason = (e.reason && (e.reason.message || e.reason.toString())) || '';

      });
