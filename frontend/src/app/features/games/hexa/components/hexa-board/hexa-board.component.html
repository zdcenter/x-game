
    <div class="relative w-full h-full select-none" (contextmenu)="$event.preventDefault()">
      <svg [attr.viewBox]="viewBox" class="w-full h-full drop-shadow-lg overflow-visible">
        <!-- Grid Cells -->
        <g *ngFor="let cell of cells">
          <polygon
            [attr.points]="hexPoints(cell.q, cell.r)"
            [attr.fill]="cell.filled ? (cell.color || 'url(#pieceGrad)') : (isClearing(cell) ? clearingColor(cell) : 'var(--color-hexa-empty)')"
            [attr.stroke]="(cell.filled || isClearing(cell)) ? 'rgba(255,255,255,0.2)' : 'var(--color-hexa-empty-stroke)'"
            [attr.stroke-width]="(cell.filled || isClearing(cell)) ? '0.8' : '1.2'"
            stroke-linejoin="round"
            [class.hexa-cell-clearing]="isClearing(cell)"
            [class.transition-colors]="!isClearing(cell)"
            class="duration-200"
            [attr.filter]="(cell.filled || isClearing(cell)) ? 'url(#shadow3dLight)' : null">
          </polygon>
        </g>
        
        <!-- Hover Preview -->
        <g *ngIf="previewPiece && previewOrigin">
          <polygon *ngFor="let offset of previewPiece.shape"
            [attr.points]="hexPoints(previewOrigin.q + offset.q, previewOrigin.r + offset.r)"
            [attr.fill]="previewPiece.color || 'url(#pieceGrad)'"
            class="opacity-40"
            stroke="white"
            stroke-width="2"
            stroke-dasharray="4">
          </polygon>
        </g>
      </svg>
    </div>
