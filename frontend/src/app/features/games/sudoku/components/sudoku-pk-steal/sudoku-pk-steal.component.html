
    <div class="flex-grow flex flex-col p-2 md:p-6 gap-2 md:gap-6 overflow-hidden relative">
      
      @if ((store.isFinished() || store.gameStatus() === 'finished') && showOverlay()) {
        <app-game-result-overlay
          currentGameId="sudoku"
          [status]="isWinner() ? 'win' : 'lose'"
          [title]="isWinner() ? i18n.t('game.win')() : i18n.t('game.lose')()"
          [stats]="getStats()"
          [showLeave]="store.hostId() !== store.playerId()"
          [showRestart]="store.hostId() === store.playerId()"
          [showDismiss]="store.hostId() === store.playerId()"
          (restart)="store.playAgain()"
          (dismiss)="store.dismissRoom()"
          (leave)="store.view.set('lobby')">
        </app-game-result-overlay>
      }

      <!-- Top Navigation Bar -->
      <div class="flex flex-col shrink-0 -mx-2 md:-mx-6 -mt-2 md:-mt-6 mb-2 md:mb-0">
        <app-game-header
          [title]="'Sudoku'"
          [subtitle]="getModeName() + (getDiffName() ? ' - ' + getDiffName() : '')"
          iconGradientClass="from-blue-500 to-emerald-500"
          titleGradientClass="from-blue-400 to-emerald-400"
          shadowClass="shadow-emerald-500/20"
          headerBgClass="bg-gradient-to-r from-blue-900/20 to-emerald-900/20 px-4 md:px-8 pb-2 mb-0"
          (back)="store.leaveRoom()">
          
          <div game-icon class="text-2xl sm:text-3xl md:text-4xl drop-shadow-md">🔢</div>

          <ng-container header-right>
            <div class="flex items-center gap-1 sm:gap-2">
              <button (click)="store.leaveRoom()" class="px-2 lg:px-4 py-1 lg:py-2 bg-red-500/10 text-red-500 hover:bg-red-500 hover:text-white border border-red-500/20 rounded-lg lg:rounded-xl text-[10px] lg:text-sm font-bold transition-colors flex items-center gap-1 lg:gap-2 shadow-inner">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3 lg:h-4 lg:w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                </svg>
                <span class="hidden sm:inline"><ng-container i18n="@@game.leave">Leave</ng-container></span>
              </button>
              
              <button (click)="openLobby.emit()" class="p-1.5 lg:p-2 rounded-full text-[var(--color-text-muted)] hover:text-[var(--color-text-main)] hover:bg-black/10 dark:hover:bg-white/10 transition-colors active:scale-95">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 lg:h-5 lg:w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" />
                </svg>
              </button>
            </div>
          </ng-container>
        </app-game-header>
      </div>

      <!-- Top Progress Bars -->
      @if (isFrozenSignal()) {
        <div class="absolute inset-0 z-50 flex items-center justify-center bg-blue-900/40 backdrop-blur-sm rounded-xl">
          <div class="text-center animate-bounce">
            <div class="text-6xl mb-4">❄️</div>
            <h2 class="text-3xl font-black text-blue-200 drop-shadow-md tracking-widest uppercase">Frozen</h2>
            <div class="mt-4 text-2xl font-black text-white font-mono tracking-widest bg-black/50 px-6 py-2 rounded-full inline-block">
              {{ frozenCountdownDisplay() }}s
            </div>
          </div>
        </div>
      }

      <div class="w-full max-w-[800px] mx-auto flex gap-2 lg:gap-4 items-center pb-2 px-2">
        <!-- Local Player -->
        <app-player-badge class="flex-1 min-w-[150px] lg:min-w-[200px] lg:max-w-[300px] shrink-0" layout="card"
          [playerName]="store.playerId()"
          [isHost]="store.playerId() === store.hostId()"
          [isMe]="true"
          [score]="store.players()[store.playerId()]?.score || 0"
          [status]="GameStatus.Playing">
        </app-player-badge>

        <!-- Opponents -->
        <app-player-list-container [opponentsCount]="getSortedPlayers().length - 1" class="flex-1 min-w-0 flex justify-end lg:justify-start">
          <ng-template #opponentsList>
            @for (player of getSortedPlayers(); track player.id) {
              @if (player.id !== store.playerId()) {
                <app-player-badge class="w-full lg:flex-1 lg:min-w-[200px] lg:max-w-[300px] shrink-0" layout="card"
                  [playerName]="player.id"
                  [isHost]="player.id === store.hostId()"
                  [isMe]="false"
                  [score]="player.score"
                  [status]="GameStatus.Playing">
                </app-player-badge>
              }
            }
          </ng-template>
        </app-player-list-container>
      </div>

      <!-- Board, Numpad, Tools Area -->
      <div class="flex-grow flex flex-col md:grid md:grid-cols-[minmax(0,500px)_64px] justify-start md:justify-center md:content-start items-center md:items-start gap-2 md:gap-6 min-h-0 w-full max-w-[500px] md:max-w-none mx-auto">
        <div class="order-1 relative min-w-0 w-full max-w-[min(100%,calc(100vh-280px))] mx-auto" [class.animate-board-shake]="store.isFinished() || store.gameStatus() === 'finished'">
          <app-sudoku-board class="w-full"></app-sudoku-board>
        </div>

        <div class="order-2 md:order-none md:col-start-2 md:row-start-1 md:row-span-2 w-full md:w-16 flex-shrink-0 mt-1 md:mt-0">
          <app-sudoku-numpad></app-sudoku-numpad>
        </div>

        <div class="order-3 md:order-none md:col-start-1 md:row-start-2 w-full mt-1 md:mt-0">
          <app-sudoku-tools class="w-full"></app-sudoku-tools>
        </div>
      </div>
    </div>
