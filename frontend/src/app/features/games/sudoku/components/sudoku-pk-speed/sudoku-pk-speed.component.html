
    <div class="flex-grow flex flex-col p-2 md:p-6 gap-2 md:gap-6 overflow-y-auto custom-scrollbar relative">
      
      @if ((store.isFinished() || store.gameStatus() === GameStatus.Finished) && showOverlay()) {
        <app-game-result-overlay
          currentGameId="sudoku"
          [status]="isWinner() ? 'win' : 'lose'"
          [title]="isWinner() ? i18n.t('game.win')() : i18n.t('game.lose')()"
          [stats]="getStats()"
          [showLeave]="store.hostId() !== store.playerId()"
          [showRestart]="store.hostId() === store.playerId()"
          [showDismiss]="store.hostId() === store.playerId()"
          (restart)="store.playAgain()"
          (dismiss)="store.dismissRoom()"
          (leave)="store.view.set('lobby')"
          [enableChangeRoomGame]="store.currentRoomMode() !== GameMode.Single && store.hostId() === store.playerId()"
          (changeRoomGame)="store.changeRoomGame($event)">
        </app-game-result-overlay>
      }



      <!-- Mobile floating HUD -->
      <app-game-player-mini-hud
        class="lg:hidden"
        [myPlayer]="{ playerName: store.playerId(), isHost: store.playerId() === store.hostId(), stats: [{ icon: '📝', value: (store.players()[store.playerId()]?.progress || 0) + '/81' }], status: store.players()[store.playerId()]?.finished ? 'finished' : 'playing' }"
        [opponents]="getPlayers().filter(p => p.id !== store.playerId()).map(p => ({ playerName: p.id, isHost: p.id === store.hostId(), stats: [{ icon: '📝', value: p.progress + '/81' }], status: p.finished ? 'finished' : 'playing' }))">
      </app-game-player-mini-hud>

      <!-- Top Progress Bars (desktop only) -->
      <div class="hidden lg:flex w-full max-w-[800px] mx-auto gap-2 lg:gap-4 items-center pb-2 px-2">
        <!-- Local Player -->
        <app-player-badge class="flex-1 min-w-[150px] lg:min-w-[200px] lg:max-w-[300px] shrink-0" layout="card"
          [playerName]="store.playerId()"
          [isHost]="store.playerId() === store.hostId()"
          [isMe]="true"
          [stats]="[{ icon: '📝', value: (store.players()[store.playerId()]?.progress || 0) + '/81' }]"
          [status]="store.players()[store.playerId()]?.finished ? GameStatus.Finished : GameStatus.Playing">
        </app-player-badge>

        <!-- Opponents -->
        <app-player-list-container [opponentsCount]="getPlayers().length - 1" class="flex-1 min-w-0 flex justify-end lg:justify-start">
          <ng-template #opponentsList>
            @for (player of getPlayers(); track player.id) {
              @if (player.id !== store.playerId()) {
                <app-player-badge class="w-full lg:flex-1 lg:min-w-[200px] lg:max-w-[300px] shrink-0" layout="card"
                  [playerName]="player.id"
                  [isHost]="player.id === store.hostId()"
                  [isMe]="false"
                  [stats]="[{ icon: '📝', value: player.progress + '/81' }]"
                  [status]="player.finished ? GameStatus.Finished : GameStatus.Playing">
                </app-player-badge>
              }
            }
          </ng-template>
        </app-player-list-container>
      </div>

      <div class="flex-grow flex flex-col md:grid md:grid-cols-[minmax(0,500px)_64px] justify-start md:justify-center md:content-start items-center md:items-start gap-2 md:gap-6 min-h-0 w-full max-w-[500px] md:max-w-none mx-auto">
        <div class="order-1 relative min-w-0 w-full max-w-[min(100%,calc(100vh-360px))] mx-auto" [class.animate-board-shake]="store.isFinished() || store.gameStatus() === GameStatus.Finished">
          <app-sudoku-board class="w-full"></app-sudoku-board>
        </div>

        <div class="order-2 md:order-none md:col-start-2 md:row-start-1 md:row-span-2 w-full md:w-16 flex-shrink-0 mt-1 md:mt-0">
          <app-sudoku-numpad></app-sudoku-numpad>
        </div>

        <div class="order-3 md:order-none md:col-start-1 md:row-start-2 w-full mt-1 md:mt-0">
          <app-sudoku-tools class="w-full"></app-sudoku-tools>
        </div>
      </div>
    </div>
