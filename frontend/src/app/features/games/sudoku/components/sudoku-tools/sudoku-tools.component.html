
    <div class="flex justify-center gap-1.5 md:gap-3 w-full">
      @if (store.currentRoomMode() === GameMode.Single) {
        <app-game-toolbar
          [layoutStyle]="'compact'"
          [showPrev]="false"
          [showNext]="false"
          [showUndo]="false"
          [showRestart]="false"
          [showHint]="true"
          hintLayout="sudoku"
          (hintApplied)="store.applyHint()"
          class="flex-1 flex flex-col"
        ></app-game-toolbar>
      }

      <button 
        (click)="onClear()"
        class="flex-1 flex flex-col items-center justify-center p-1.5 md:p-3 bg-[var(--color-bg-card)] rounded-xl border border-[var(--color-border-card)] hover:bg-[var(--color-bg-main)] transition-colors active:scale-95 text-[var(--color-text-main)] text-orange-500 touch-manipulation select-none cursor-pointer">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 md:h-7 md:w-7 mb-0.5 md:mb-1 opacity-90" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
        </svg>
        <span class="text-xs md:text-sm font-semibold">{{ i18n.t('game.clear')() }}</span>
      </button>

      <button 
        (click)="onUndo()"
        class="flex-1 flex flex-col items-center justify-center p-1.5 md:p-3 bg-[var(--color-bg-card)] rounded-xl border border-[var(--color-border-card)] hover:bg-[var(--color-bg-main)] transition-colors active:scale-95 text-[var(--color-text-main)] touch-manipulation select-none cursor-pointer">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 md:h-7 md:w-7 mb-0.5 md:mb-1 opacity-70" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6" />
        </svg>
        <span class="text-xs md:text-sm font-semibold">{{ i18n.t('game.undo')() }}</span>
      </button>

      <button 
        (click)="onErase()"
        class="flex-1 flex flex-col items-center justify-center p-1.5 md:p-3 bg-[var(--color-bg-card)] rounded-xl border border-[var(--color-border-card)] hover:bg-[var(--color-bg-main)] transition-colors active:scale-95 text-[var(--color-text-main)] touch-manipulation select-none cursor-pointer">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 md:h-7 md:w-7 mb-0.5 md:mb-1 text-red-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
        </svg>
        <span class="text-xs md:text-sm font-semibold">{{ i18n.t('game.erase')() }}</span>
      </button>

      <button 
        (click)="onTogglePencil()"
        class="flex-1 flex flex-col items-center justify-center p-1.5 md:p-3 rounded-xl border transition-all active:scale-95 touch-manipulation select-none cursor-pointer"
        [class.bg-[var(--color-accent-from)]]="store.pencilMode()"
        [class.border-[var(--color-accent-from)]]="store.pencilMode()"
        [class.text-white]="store.pencilMode()"
        [class.bg-[var(--color-bg-card)]]="!store.pencilMode()"
        [class.border-[var(--color-border-card)]]="!store.pencilMode()"
        [class.text-[var(--color-text-main)]]="!store.pencilMode()"
        [class.hover:bg-[var(--color-bg-main)]]="!store.pencilMode()"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 md:h-7 md:w-7 mb-0.5 md:mb-1" 
             [class.opacity-100]="store.pencilMode()"
             [class.opacity-70]="!store.pencilMode()"
             fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" />
        </svg>
        <span class="text-xs md:text-sm font-semibold">{{ i18n.t('game.notes')() }}</span>
      </button>

      <!-- 🎓 教程 (对齐全站卡片规范) -->
      @if (store.currentRoomMode() === GameMode.Single) {
        <button 
          (click)="onTutorialClick()"
          class="flex-1 flex flex-col items-center justify-center p-1.5 md:p-3 rounded-xl border border-blue-500/30 bg-blue-500/10 hover:bg-blue-500/20 text-blue-600 dark:text-blue-400 font-bold transition-all active:scale-95 touch-manipulation select-none cursor-pointer relative group"
          [class.ring-2]="store.isTutorialActive()"
          [class.ring-blue-500]="store.isTutorialActive()"
          [title]="i18n.t('tutorial.interactive.btn_tutorial')() || '新手教程'">
          @if (!store.hasCompletedTutorial() && !store.isTutorialActive()) {
            <span class="absolute -top-1 -right-1 flex h-2.5 w-2.5">
              <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-blue-400 opacity-75"></span>
              <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-blue-500"></span>
            </span>
          }
          <span class="text-base md:text-xl mb-0.5 md:mb-1 drop-shadow-md group-hover:scale-110 transition-transform">🎓</span>
          <span class="text-xs md:text-sm font-semibold">{{ store.isTutorialActive() ? (i18n.t('tutorial.interactive.btn_restart')() || '重置') : (i18n.t('tutorial.interactive.btn_tutorial')() || '教程') }}</span>
        </button>
      }
    </div>
