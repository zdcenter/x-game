
    <div class="flex justify-center gap-2 md:gap-4 w-full">
      <button 
        (click)="store.clearBoard()"
        class="flex-1 flex flex-col items-center justify-center p-2 md:p-4 bg-[var(--color-bg-card)] rounded-xl border border-[var(--color-border-card)] hover:bg-[var(--color-bg-main)] transition-colors active:scale-95 text-[var(--color-text-main)] text-orange-500">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 md:h-8 md:w-8 mb-1 md:mb-2 opacity-90" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
        </svg>
        <span class="text-xs md:text-sm font-semibold"><ng-container i18n="@@game.clear">game.clear</ng-container></span>
      </button>

      <button 
        (click)="store.undo()"
        class="flex-1 flex flex-col items-center justify-center p-2 md:p-4 bg-[var(--color-bg-card)] rounded-xl border border-[var(--color-border-card)] hover:bg-[var(--color-bg-main)] transition-colors active:scale-95 text-[var(--color-text-main)]">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 md:h-8 md:w-8 mb-1 md:mb-2 opacity-70" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6" />
        </svg>
        <span class="text-xs md:text-sm font-semibold"><ng-container i18n="@@game.undo">game.undo</ng-container></span>
      </button>

      <button 
        (click)="store.erase()"
        class="flex-1 flex flex-col items-center justify-center p-2 md:p-4 bg-[var(--color-bg-card)] rounded-xl border border-[var(--color-border-card)] hover:bg-[var(--color-bg-main)] transition-colors active:scale-95 text-[var(--color-text-main)]">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 md:h-8 md:w-8 mb-1 md:mb-2 text-red-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
        </svg>
        <span class="text-xs md:text-sm font-semibold"><ng-container i18n="@@game.erase">game.erase</ng-container></span>
      </button>

      <button 
        (click)="store.togglePencilMode()"
        class="flex-1 flex flex-col items-center justify-center p-2 md:p-4 rounded-xl border transition-all active:scale-95"
        [class.bg-[var(--color-accent-from)]]="store.pencilMode()"
        [class.border-[var(--color-accent-from)]]="store.pencilMode()"
        [class.text-white]="store.pencilMode()"
        [class.bg-[var(--color-bg-card)]]="!store.pencilMode()"
        [class.border-[var(--color-border-card)]]="!store.pencilMode()"
        [class.text-[var(--color-text-main)]]="!store.pencilMode()"
        [class.hover:bg-[var(--color-bg-main)]]="!store.pencilMode()"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 md:h-8 md:w-8 mb-1 md:mb-2" 
             [class.opacity-100]="store.pencilMode()"
             [class.opacity-70]="!store.pencilMode()"
             fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" />
        </svg>
        <span class="text-xs md:text-sm font-semibold"><ng-container i18n="@@game.notes">game.notes</ng-container></span>
      </button>
    </div>
