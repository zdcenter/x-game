<div class="flex-1 flex flex-col p-0 sm:p-2 lg:p-4 w-full h-full min-w-0 min-h-0">
  <div class="flex-1 flex flex-col w-full h-full bg-[var(--color-bg-card)] rounded-none sm:rounded-2xl shadow-none sm:shadow-xl border-0 sm:border border-[var(--color-border-card)] min-w-0 min-h-0 overflow-hidden">

    <!-- Header Tabs -->
    <div class="flex border-b border-[var(--color-border-card)] bg-[var(--color-bg-main)] shrink-0">
      @for (diff of difficulties; track diff.id) {
        <button 
          (click)="selectDifficulty(diff.id)"
          class="flex-1 py-3 sm:py-4 text-center font-bold text-xs sm:text-base lg:text-lg transition-all border-b-2"
          [class.text-blue-500]="activeTab() === diff.id"
          [class.border-blue-500]="activeTab() === diff.id"
          [class.text-[var(--color-text-muted)]]="activeTab() !== diff.id"
          [class.border-transparent]="activeTab() !== diff.id"
          [class.hover:text-[var(--color-text-main)]]="activeTab() !== diff.id">
          {{ i18n.t($any(diff.labelKey))() }}
        </button>
      }
    </div>

    <!-- Level Grid Header -->
    <div class="flex items-center justify-between px-4 sm:px-6 pt-3 pb-1 shrink-0">
      <span class="text-xs font-bold uppercase tracking-widest text-[var(--color-text-muted)]">
        总关卡: {{ levels().length }}
      </span>
    </div>
    
    <div #scrollContainer class="flex-1 px-3 sm:px-6 pb-12 sm:pb-6 overflow-y-auto custom-scrollbar flex flex-col gap-4 sm:gap-6 min-h-0" style="touch-action: pan-y !important; -webkit-overflow-scrolling: touch; overscroll-behavior-y: contain;">
      <div class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-5 lg:grid-cols-6 xl:grid-cols-8 gap-3 sm:gap-4 shrink-0">
        @for (level of paginatedLevels(); track level.id; let i = $index) {
          <button 
            (click)="playLevel(level, (currentPage() - 1) * pageSize + i)"
            class="aspect-square flex items-center justify-center rounded-xl text-lg sm:text-xl font-bold transition-all duration-300 relative group overflow-hidden shadow-lg border"
            [ngClass]="{
              'bg-[var(--color-bg-card)] text-emerald-500 border-emerald-500/50 hover:bg-emerald-500/10': level.progress?.status === GameStatus.Finished,
              'bg-[var(--color-bg-main)] text-[var(--color-text-main)] border-[var(--color-border-card)] hover:bg-[var(--color-bg-card)] hover:border-[var(--color-border-thick)] hover:text-[var(--color-accent-from)]': level.progress?.status !== GameStatus.Finished
            }">
            
            <span class="z-10 relative text-sm sm:text-base whitespace-nowrap">关卡 {{ (currentPage() - 1) * pageSize + i + 1 | number:'3.0-0' }}</span>
            
            @if (level.progress?.status === GameStatus.Finished) {
              <div class="absolute inset-0 flex items-center justify-center opacity-20 group-hover:opacity-30 transition-opacity">
                <span class="text-4xl">⭐</span>
              </div>
              <div class="absolute -top-1 -right-1">
                <span class="text-emerald-500 drop-shadow-[0_0_8px_rgba(16,185,129,0.8)] text-sm sm:text-base">★</span>
              </div>
            }
          </button>
        }
      </div>

      <!-- Pagination Controls -->
      @if (totalPages() > 1) {
        <div class="flex justify-center items-center gap-4 pt-4 shrink-0 border-t border-[var(--color-border-card)]">
          <button 
            (click)="prevPage()" 
            [disabled]="currentPage() === 1"
            class="px-4 py-2 rounded-lg bg-[var(--color-bg-main)] border border-[var(--color-border-card)] disabled:opacity-50 disabled:cursor-not-allowed hover:bg-[var(--color-bg-card)] transition-colors">
            {{ i18n.t('game.prev_page')() }}
          </button>
          
          <span class="text-sm font-medium text-[var(--color-text-muted)]">
            {{ i18n.t('game.page_info')().replace('{current}', currentPage().toString()).replace('{total}', totalPages().toString()) }}
          </span>
          
          <button 
            (click)="nextPage()" 
            [disabled]="currentPage() === totalPages()"
            class="px-4 py-2 rounded-lg bg-[var(--color-bg-main)] border border-[var(--color-border-card)] disabled:opacity-50 disabled:cursor-not-allowed hover:bg-[var(--color-bg-card)] transition-colors">
            {{ i18n.t('game.next_page')() }}
          </button>
        </div>
      }
    </div>
  </div>
</div>
