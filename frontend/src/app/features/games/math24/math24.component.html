<div class="h-[calc(100vh-64px)] w-full flex flex-col lg:flex-row bg-[var(--color-bg-main)] text-[var(--color-text-main)] transition-colors duration-300 relative overflow-hidden">

  <!-- Main Game Area (Left/Top side) -->
  <div class="flex-1 flex flex-col min-w-0 relative h-full bg-[var(--color-bg-card)] rounded-none lg:rounded-2xl lg:m-2 lg:border lg:border-[var(--color-border-card)] shadow-xl overflow-hidden overscroll-none select-none">

    @if (view() === 'lobby') {
      <app-math24-lobby class="flex-grow flex flex-col min-h-0"
        (levelSelect)="startLevel($event)"
        (openLobby)="isMobileSidebarOpen.set(true)"
        (back)="returnToLobby()">
      </app-math24-lobby>
    } @else if (view() === 'room') {
      <app-game-waiting-room 
        [gameId]="'math24'"
        [mode]="store.currentMode()"
        [roomId]="store.roomId()" [difficulty]="'medium'"
        [players]="store.playersList()"
        [currentUserId]="playerId"
        [hostId]="store.host()"
        [readyPlayers]="store.readyPlayers()"
        (start)="store.startGame()"
        (leave)="returnToLobby()"
        (changeSettings)="openChangeSettings()"
        (kick)="store.kickPlayer($event)"
        (ready)="store.ready()"
        (cancelReady)="store.cancelReady()">
      </app-game-waiting-room>
    } @else {
      <!-- PLAY VIEW -->
      <ng-container *ngIf="store.currentMode() === 'single'; else pkHeader">
        <app-game-header 
          i18n-title="@@lobby.math24" title="lobby.math24"
          i18n-subtitle="@@game.single_mode" subtitle="game.single_mode"
          iconGradientClass="from-blue-500 to-indigo-600"
          titleGradientClass="from-blue-400 to-indigo-500"
          shadowClass="shadow-blue-500/20"
          headerBgClass="bg-transparent"
          (back)="view.set('lobby')"
          (rules)="showRules.set(true)">
          <img game-icon src="/assets/games/icons/math24.svg" alt="Math24" class="w-6 h-6 sm:w-8 sm:h-8 md:w-10 md:h-10 drop-shadow-md" />
          <div header-right class="flex items-center gap-2">
            <button (click)="isMobileSidebarOpen.set(true)" class="p-1.5 md:p-2 bg-[var(--color-bg-main)] border border-[var(--color-border-card)] rounded-lg text-blue-400 shadow-sm active:scale-95 transition-all z-10 hover:bg-[var(--color-bg-card)]">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" />
              </svg>
            </button>
          </div>
        </app-game-header>
      </ng-container>

      <ng-template #pkHeader>
        <app-game-header 
          i18n-title="@@lobby.math24" title="lobby.math24"
          [subtitle]="store.currentMode() === 'pk_speed' ? i18n.t('game.speed_mode')() : i18n.t('game.steal_mode')()"
          iconGradientClass="from-blue-500 to-indigo-600"
          titleGradientClass="from-blue-400 to-indigo-500"
          shadowClass="shadow-blue-500/20"
          headerBgClass="bg-transparent"
          (back)="returnToLobby()"
          (rules)="showRules.set(true)">
          <img game-icon src="/assets/games/icons/math24.svg" alt="Math24" class="w-6 h-6 sm:w-8 sm:h-8 md:w-10 md:h-10 drop-shadow-md" />
          <div header-right class="flex items-center gap-2">
            <button (click)="isMobileSidebarOpen.set(true)" class="p-1.5 md:p-2 bg-[var(--color-bg-main)] border border-[var(--color-border-card)] rounded-lg text-blue-400 shadow-sm active:scale-95 transition-all z-10 hover:bg-[var(--color-bg-card)]">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" />
              </svg>
            </button>
          </div>
        </app-game-header>
      </ng-template>

      <div class="flex-1 overflow-y-auto relative p-2 lg:p-4 h-full flex flex-col items-center justify-start lg:justify-center">
        <!-- Result Overlay -->
        @if (store.isFinished()) {
          <app-game-result-overlay
            currentGameId="math24"
            [status]="getGameResultStatus()"
            [title]="getGameResultTitle()"
            [stats]="getStats()"
            [showLeave]="store.currentMode() === 'single' || store.host() !== playerId"
            [showNextLevel]="store.currentMode() === 'single'"
            [showRestart]="store.currentMode() === 'single' || store.host() === playerId"
            [showDismiss]="store.currentMode() !== 'single' && store.host() === playerId"
            (leave)="view.set('lobby')"
            (nextLevel)="playNextLevel()"
            (restart)="playAgain()"
            (dismiss)="store.dismissRoom()">
          </app-game-result-overlay>
        }

        <!-- PK Steal Mode -->
        <ng-container *ngIf="store.currentMode() === 'pk_steal' && store.gameStatus() !== 'waiting'">
          <app-math24-pk-steal [playerId]="playerId" [hostId]="store.host()"></app-math24-pk-steal>
        </ng-container>

        <!-- PK Speed Mode -->
        <ng-container *ngIf="store.currentMode() === 'pk_speed' && store.gameStatus() !== 'waiting'">
          <app-math24-pk-speed [playerId]="playerId" [hostId]="store.host()"></app-math24-pk-speed>
        </ng-container>

        <!-- Single Player Mode -->
        <ng-container *ngIf="store.currentMode() === 'single'">
          <!-- Local Player (You) -->
          <div class="flex-none py-2 border-b border-[var(--color-border-card)] shrink-0 w-full mb-4 mt-[-8px]">
            <div class="w-full max-w-[800px] mx-auto flex gap-2 lg:gap-4 items-center px-2 justify-center">
              <app-player-badge class="flex-1 min-w-[150px] lg:min-w-[200px] lg:max-w-[300px] shrink-0" layout="card"
                [playerName]="playerId"
                [isHost]="true"
                [isMe]="true"
                [stats]="[
                  { icon: '⏱️', value: store.timeSpent() + 's', colorClass: store.isFinished() ? '' : 'text-pink-400' }
                ]"
                [status]="store.isFinished() ? 'finished' : 'playing'"></app-player-badge>
            </div>
          </div>
          <app-math24-board></app-math24-board>
        </ng-container>

        <!-- Starting Overlay -->
        @if (store.gameStatus() === 'starting') {
          <app-game-starting-overlay [countdown]="startingCountdown()"></app-game-starting-overlay>
        }
      </div>
    }
  </div>

  <!-- Sidebar Overlay Backdrop -->
  @if (isMobileSidebarOpen()) {
    <div class="fixed inset-0 bg-[var(--color-overlay)] backdrop-blur-sm z-40 lg:hidden" (click)="isMobileSidebarOpen.set(false)"></div>
  }

  <!-- Right Sidebar: Lobby Panel -->
  <div class="flex-shrink-0 transition-transform duration-300"
       [ngClass]="{
         'fixed inset-y-0 right-0 z-50 w-[85vw] sm:w-96 bg-[var(--color-bg-main)] shadow-2xl p-4 flex flex-col': true,
         'translate-x-0': isMobileSidebarOpen(),
         'translate-x-full': !isMobileSidebarOpen(),
         'lg:relative lg:inset-auto lg:w-80 lg:shadow-none lg:p-0 lg:z-auto lg:translate-x-0 lg:border-l lg:border-[var(--color-border-card)]': true
       }">
    <div class="flex justify-between items-center mb-4 lg:hidden">
      <h3 class="font-bold text-lg text-[var(--color-text-main)]"><ng-container i18n="@@game.room_info">Room Info</ng-container></h3>
    </div>
    <app-game-lobby-panel 
      #lobbyPanel
      class="flex-grow flex"
      [currentGameId]="'math24'"
      [currentRoomId]="store.roomId()"
      (joinRoom)="handleJoinRoom($event)"
      (createRoom)="handleCreateRoom($event)"
      (dismissRoom)="handleDismissRoom()">
    </app-game-lobby-panel>
  </div>
  
  <!-- Rules Modal -->
  <app-game-rules-modal [gameId]="'math24'" [isOpen]="showRules()" (closed)="showRules.set(false)"></app-game-rules-modal>
</div>
