<app-game-layout
  [gameId]="'math24'"
  [title]="i18n.t('lobby.math24')()"
  [subtitle]="getSubtitle()"
  icon="🃏"
  iconGradientClass="from-blue-500 to-indigo-600"
  titleGradientClass="from-blue-400 to-indigo-500"
  shadowClass="shadow-blue-500/20"
  headerBgClass="dark:bg-gradient-to-r dark:from-blue-900/30 dark:to-indigo-900/30 px-4 lg:px-6 py-2 lg:py-3 mb-0"
  [currentRoomMode]="store.currentRoomMode()"
  [currentRoomId]="store.roomId()"
  [status]="store.status()"
  [showRules]="showRules()"
  [showMobileSidebar]="isMobileSidebarOpen()"
  [showPlayAgainBtn]="store.currentRoomMode() === GameMode.Single && store.status() === GameStatus.Finished && showOverlay()"
  [showLeaveBtn]="store.currentRoomMode() !== GameMode.Single"
  (rulesClosed)="showRules.set(false)"
  (rulesOpen)="showRules.set(true)"
  (titleClick)="handleTitleClick()"
  (back)="goBack()"
  (playAgain)="store.startGame()"
  (navigateToPk)="navigateToPkArena()"
  (joinRoom)="handleJoinRoom($event)"
  (createRoom)="handleCreateRoom($event)"
  (mobileSidebarClosed)="isMobileSidebarOpen.set(false)"
>
@if (view() === 'lobby') {
        <app-math24-lobby class="flex-grow flex flex-col w-full h-full min-h-[600px]"
          (levelSelect)="startLevel($event)"
          (openLobby)="navigateToPkArena()">
        </app-math24-lobby>
      } @else if (view() === 'room') {
        <div class="w-full flex-grow flex flex-col backdrop-blur-xl border rounded-2xl lg:rounded-3xl shadow-[0_0_50px_rgba(0,0,0,0.5)] transition-colors duration-300 overflow-hidden"
             style="background-color: var(--color-bg-card); border-color: var(--color-border-card)">
          <app-game-waiting-room
            class="flex-1 min-h-0"
            [gameId]="'math24'"
            [mode]="store.currentRoomMode()"
            [roomId]="store.roomId()" [difficulty]="GameDifficulty.Medium"
            [players]="store.playersList()"
            [currentUserId]="playerId"
            [hostId]="store.hostId()"
            [readyPlayers]="store.readyPlayers()"
            [target]="store.currentRoomTarget()"
            (start)="store.startGame()"
            (leave)="goBack()"
            (changeSettings)="openChangeSettings()"
            (kick)="store.kickPlayer($event)"
            (ready)="store.ready()"
            (cancelReady)="store.cancelReady()">
          </app-game-waiting-room>
        </div>
      } @else {
        <!-- PLAY VIEW -->
        <div class="w-full flex-grow flex flex-col backdrop-blur-xl border rounded-2xl lg:rounded-3xl shadow-[0_0_50px_rgba(0,0,0,0.5)] transition-colors duration-300 overflow-hidden"
             style="background-color: var(--color-bg-card); border-color: var(--color-border-card)">
          
          <div class="flex-1 overflow-y-auto relative p-2 lg:p-4 h-full flex flex-col items-center justify-start lg:justify-center">
            <!-- Result Overlay -->
            @if (store.isFinished() && showOverlay()) {
              <app-game-result-overlay
                currentGameId="math24"
                [status]="getGameResultStatus()"
                [title]="getGameResultTitle()"
                [stats]="getStats()"
                [xpResult]="store.lastStatResult()?.xp_result"
                [isNewRecord]="store.lastStatResult()?.isNewRecord"
                [showLeave]="store.currentRoomMode() === GameMode.Single || store.hostId() !== playerId"
                [showNextLevel]="store.currentRoomMode() === GameMode.Single"
                [showRestart]="store.currentRoomMode() === GameMode.Single || store.hostId() === playerId"
                [showDismiss]="store.currentRoomMode() !== GameMode.Single && store.hostId() === playerId"
                (leave)="view.set('lobby')"
                (nextLevel)="playNextLevel()"
                (restart)="store.currentRoomMode() === GameMode.Single ? playNextLevel() : store.restartGame()"
              [enableChangeRoomGame]="store.currentRoomMode() !== GameMode.Single && store.hostId() === store.playerId()"
              (changeRoomGame)="store.changeRoomGame($event)">
              </app-game-result-overlay>
            }

            <!-- PK Steal Mode -->
            <ng-container *ngIf="store.currentRoomMode() === GameMode.Steal && store.status() !== GameStatus.Waiting">
              <app-math24-pk-steal [playerId]="playerId" [hostId]="store.hostId()"></app-math24-pk-steal>
            </ng-container>

            <!-- PK Speed Mode -->
            <ng-container *ngIf="store.currentRoomMode() === GameMode.Speed && store.status() !== GameStatus.Waiting">
              <app-math24-pk-speed [playerId]="playerId" [hostId]="store.hostId()"></app-math24-pk-speed>
            </ng-container>

            <!-- Single Player Mode -->
            <ng-container *ngIf="store.currentRoomMode() === GameMode.Single">
              <app-math24-board></app-math24-board>
            </ng-container>

            <!-- Starting Overlay -->
            @if (store.status() === GameStatus.Starting) {
              <app-game-starting-overlay [countdown]="startingCountdown()"></app-game-starting-overlay>
            }
          </div>
        </div>
      }
</app-game-layout>
