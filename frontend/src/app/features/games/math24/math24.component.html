<app-game-layout
  [store]="store"
  [gameId]="'math24'"
  [title]="i18n.t('lobby.math24')()"
  [subtitle]="getSubtitle()"
  icon="🃏"
  iconGradientClass="from-blue-500 to-indigo-600"
  titleGradientClass="from-blue-400 to-indigo-500"
  shadowClass="shadow-blue-500/20"
  headerBgClass="dark:bg-gradient-to-r dark:from-blue-900/30 dark:to-indigo-900/30 px-4 lg:px-6 py-2 lg:py-3 mb-0"
  [currentDifficulty]="store.currentDifficulty()"
  (difficultyChange)="onDifficultyChange($event)"
  [showRules]="showRules()"
  [showMobileSidebar]="isMobileSidebarOpen()"
  [showPlayAgainBtn]="store.currentRoomMode() === GameMode.Single && store.status() === GameStatus.Finished && showOverlay()"
  [showLeaveBtn]="store.currentRoomMode() !== GameMode.Single"
  [isLobby]="view() === 'lobby'"
  [customResultTitle]="getGameResultTitle()"
  [overlayStats]="getStats()"
  [showNextLevel]="store.currentRoomMode() === GameMode.Single"
  (rulesClosed)="showRules.set(false)"
  (rulesOpen)="showRules.set(true)"
  (titleClick)="handleTitleClick()"
  (back)="goBack()"
  (playAgain)="playAgain()"
  (rematch)="handleRematch()"
  (nextLevel)="playNextLevel()"
  (restart)="store.currentRoomMode() === GameMode.Single ? playNextLevel() : store.restartGame()"
  (navigateToPk)="navigateToPkArena()"
  (joinRoom)="handleJoinRoom($event)"
  (createRoom)="handleCreateRoom($event)"
  (mobileSidebarClosed)="isMobileSidebarOpen.set(false)"
>
  @if (view() === 'lobby') {
    <app-math24-lobby class="flex-grow flex flex-col w-full h-full min-h-0"
      (levelSelect)="startLevel($event)"
      (openLobby)="navigateToPkArena()">
    </app-math24-lobby>
  } @else {
    <!-- PLAY VIEW -->
    <div class="w-full flex-grow flex flex-col relative min-h-0 w-full items-center justify-start">
      <div class="flex-1 overflow-y-auto relative p-2 lg:p-4 h-full flex flex-col items-center justify-start w-full"
           style="touch-action: pan-y; -webkit-overflow-scrolling: touch; overscroll-behavior: contain;">
        <!-- PK Steal Mode -->
        @if (store.currentRoomMode() === GameMode.Steal && store.status() !== GameStatus.Waiting) {
          <app-math24-pk-steal class="w-full h-full" [playerId]="playerId" [hostId]="store.hostId()"></app-math24-pk-steal>
        }

        <!-- PK Speed Mode -->
        @if (store.currentRoomMode() === GameMode.Speed && store.status() !== GameStatus.Waiting) {
          <app-math24-pk-speed class="w-full h-full" [playerId]="playerId" [hostId]="store.hostId()"></app-math24-pk-speed>
        }

        <!-- Single Player Mode -->
        @if (store.currentRoomMode() === GameMode.Single) {
          <app-math24-board class="w-full"></app-math24-board>
        }
      </div>
    </div>
  }
</app-game-layout>
