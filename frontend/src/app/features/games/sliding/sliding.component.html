<app-game-layout
  [gameId]="'sliding'"
  [store]="store"
  [title]="t('sliding.title')() || 'Sliding Puzzle'"
  [subtitle]="getSubtitle()"
  icon="🔲"
  iconGradientClass="from-purple-500 to-pink-500"
  titleGradientClass="from-purple-400 to-pink-400"
  shadowClass="shadow-pink-500/20"
  headerBgClass="dark:bg-gradient-to-r dark:from-purple-900/20 dark:to-pink-900/20 px-4 lg:px-6 py-2 lg:py-3 mb-0"
  [showRules]="showRules()"
  [showMobileSidebar]="isMobileSidebarOpen()"
  [currentDifficulty]="store.currentDifficulty()"
  (difficultyChange)="changeSingleDifficulty($event)"
  [overlayStats]="getOverlayStats()"
  [customResultTitle]="getOverlayTitle()"
  (rulesClosed)="showRules.set(false)"
  (rulesOpen)="showRules.set(true)"
  (titleClick)="handleTitleClick()"
  (back)="goBack()"
  (playAgain)="store.startGame()"
  (navigateToPk)="navigateToPkArena()"
  (joinRoom)="handleJoinRoom($event)"
  (createRoom)="handleCreateRoom($event)"
  (mobileSidebarClosed)="isMobileSidebarOpen.set(false)"
>
<div class="w-full flex-grow flex flex-col justify-center my-auto items-center relative min-h-0 w-full py-1 sm:py-2">

          <!-- Single Player Classic Header -->
          @if (currentRoomMode() === GameMode.Single) {
            <div class="flex-none flex items-center justify-between px-4 py-3 bg-[var(--color-bg-sub)] rounded-2xl border border-[var(--color-border-card)] shrink-0 w-full shadow-sm mx-auto mb-2 z-10" [style.max-width]="boardSizePx()">
              
              <!-- Moves -->
              <div class="flex items-center gap-1 sm:gap-2">
                <span class="text-lg sm:text-xl md:text-2xl opacity-80 drop-shadow-sm transition-opacity" title="Moves">🔄</span>
                <div class="bg-rose-50 dark:bg-[#050505] border-2 border-rose-200 dark:border-[var(--color-border-card)] rounded flex items-center px-1 sm:px-2 py-1 shadow-[inset_0_2px_4px_rgba(225,29,72,0.1)] dark:shadow-[inset_0_2px_4px_rgba(0,0,0,0.5)] h-10 sm:h-12 min-w-16 sm:min-w-20 justify-center transition-colors duration-300">
                  <span class="font-digital text-rose-600 dark:text-red-500 font-bold text-2xl sm:text-3xl tracking-widest leading-none drop-shadow-[0_1px_1px_rgba(255,255,255,0.8)] dark:drop-shadow-[0_0_2px_rgba(239,68,68,0.8)] transition-colors duration-300">
                    {{ store.myBoard()?.moves || 0 | number:'3.0-0' }}
                  </span>
                </div>
              </div>

              <!-- Smiley Reset Button (0ms instant restart like Minesweeper) -->
              <button (click)="store.startGame()"
                      class="w-9 h-9 sm:w-10 sm:h-10 bg-gradient-to-b from-amber-300 to-amber-500 hover:from-amber-200 hover:to-amber-400 rounded-full flex items-center justify-center border border-amber-600/30 shadow-md active:scale-95 transition-all text-xl sm:text-2xl select-none cursor-pointer"
                      [title]="t('game.restart')() || 'Restart'">
                {{ store.status() === GameStatus.Finished ? '😎' : '😃' }}
              </button>

              <!-- Timer -->
              <div class="flex items-center gap-1 sm:gap-2">
                <div class="bg-slate-100 dark:bg-[#050505] border-2 border-slate-300 dark:border-[var(--color-border-card)] rounded flex items-center px-2 sm:px-3 py-1 shadow-[inset_0_2px_4px_rgba(0,0,0,0.1)] dark:shadow-[inset_0_2px_4px_rgba(0,0,0,0.5)] h-10 sm:h-12 min-w-20 sm:min-w-24 justify-center transition-colors duration-300">
                  <span class="font-digital text-slate-700 dark:text-red-500 font-bold text-2xl sm:text-3xl tracking-widest leading-none drop-shadow-[0_1px_1px_rgba(255,255,255,1)] dark:drop-shadow-[0_0_2px_rgba(239,68,68,0.8)] transition-colors duration-300">
                    {{ formatTime(getElapsedMs(store.myBoard()?.startAt || 0)) }}
                  </span>
                </div>
                <span class="text-lg sm:text-xl md:text-2xl opacity-80 drop-shadow-sm transition-opacity" title="Elapsed Time">⏱️</span>
              </div>
            </div>
          } @else {
            <!-- Universal PK Battle HUD (Sliding Puzzle) -->
            <div class="flex-none py-1.5 shrink-0 w-full max-w-4xl mx-auto px-2">
              <app-game-pk-hud
                [myStats]="myPlayerPkStats()"
                [opponents]="opponentsPkStats()"
                [roundFormat]="store.room()?.roundFormat || 'BO3'"
                [seriesScore]="seriesScore()"
                [elapsedTime]="formattedElapsedTime()"
              ></app-game-pk-hud>
            </div>
          }

          <!-- The Grid Area -->
          <div class="relative flex items-center justify-center w-full py-2 px-2 shrink-0 z-0">

            <!-- Aspect Square Board -->
            <div
              class="relative flex flex-col items-center justify-start mx-auto bg-[var(--color-sliding-board-bg)] rounded-2xl lg:rounded-3xl p-2 sm:p-3 shadow-inner border-2 border-[var(--color-sliding-board-border)] flex-shrink-0 touch-none select-none overscroll-contain aspect-square"
              [style.width]="boardSizePx()"
              [style.height]="boardSizePx()"
                (touchstart)="onTouchStart($event)" (touchend)="onTouchEnd($event)"
                style="container-type: inline-size;">

              <!-- Tiles -->
              <div class="w-full h-full relative">
                @for (tile of tiles(); track tile.val) {
                <div class="absolute p-1 sm:p-1.5 transition-transform duration-100 ease-out will-change-transform top-0 left-0" [style.width]="(100 / tile.size) + '%'"
                  [style.height]="(100 / tile.size) + '%'" [style.transform]="'translate(' + (tile.col * 100) + '%, ' + (tile.row * 100) + '%)'">
                  <button (click)="onTileClick(tile)" [disabled]="store.status() !== GameStatus.Playing"
                    class="w-full h-full rounded-lg sm:rounded-xl md:rounded-2xl flex items-center justify-center font-black font-mono tracking-tight transition-all duration-150 select-none focus:outline-none drop-shadow-xs"
                    [style.font-size]="'calc(100cqi / ' + tile.size + ' * 0.48)'"
                    [ngClass]="{
                        'bg-[var(--color-sliding-tile-bg)] hover:bg-[var(--color-sliding-tile-hover)] active:bg-[var(--color-sliding-tile-active)] text-[var(--color-sliding-tile-text)] shadow-sm active:scale-[0.98]': hintTarget() !== tile.val,
                        'bg-amber-500 text-white shadow-[0_0_20px_rgba(245,158,11,0.6)] animate-pulse active:scale-[0.98]': hintTarget() === tile.val,
                        'cursor-pointer': store.status() === GameStatus.Playing,
                        'cursor-default opacity-90': store.status() !== GameStatus.Playing
                      }">
                    {{ tile.val }}
                  </button>
                </div>
                }
              </div>

            </div>

          </div>
          
          <!-- Single Player Actions -->
          @if (currentRoomMode() === GameMode.Single) {
            <div class="flex-none flex justify-center items-center gap-4 py-2 w-full mx-auto relative z-10 shrink-0 mt-2" [style.max-width]="boardSizePx()">

              <app-game-toolbar
                [layoutStyle]="'compact'"
                [showPrev]="false"
                [showNext]="false"
                [showUndo]="false"
                [showRestart]="true"
                [showHint]="true"
                hintLayout="sudoku"
                (restart)="store.playAgain()"
                (hintApplied)="applyHint()"
                class="flex-1 min-w-[200px]"
              ></app-game-toolbar>
            </div>
          }
        </div>
</app-game-layout>
