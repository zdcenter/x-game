<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 560">
  <defs>
    <!-- Background Grid Pattern -->
    <pattern id="grid8" width="48" height="48" patternUnits="userSpaceOnUse" patternTransform="translate(58, 38)">
      <rect width="42" height="42" rx="6" fill="#0f172a" />
    </pattern>

    <!-- Block Gradient -->
    <linearGradient id="block-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <!-- 3D Block Definition -->
    <g id="block">
      <!-- Drop shadow -->
      <rect x="0" y="6" width="42" height="42" rx="6" fill="#000000" fill-opacity="0.3" />
      <!-- Bevel / 3D Edge -->
      <rect x="0" y="4" width="42" height="42" rx="6" fill="#9a3412" />
      <!-- Top Surface -->
      <rect x="0" y="0" width="42" height="42" rx="6" fill="url(#block-grad)" />
      <!-- Inner Glow / Highlight -->
      <rect x="2" y="2" width="38" height="38" rx="4" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.4" />
      <!-- Top Glossy Reflection -->
      <rect x="3" y="3" width="36" height="14" rx="3" fill="#ffffff" fill-opacity="0.25" />
    </g>

    <!-- Board Shadow -->
    <filter id="board-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="15" stdDeviation="15" flood-color="#000" flood-opacity="0.6"/>
    </filter>
    
    <!-- Pieces Shadow -->
    <filter id="piece-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Board Container -->
  <g filter="url(#board-shadow)">
    <!-- Board Base -->
    <rect x="50" y="30" width="400" height="400" rx="16" fill="#1e293b" stroke="#334155" stroke-width="4" />
    <!-- Empty Grid Cells -->
    <rect x="58" y="38" width="384" height="384" fill="url(#grid8)" opacity="0.8" />

    <!-- Placed Blocks on the Board -->
    <g>
      <!-- Row 2 (y=134) -->
      <use href="#block" x="202" y="134" />
      <use href="#block" x="250" y="134" />
      
      <!-- Row 3 (y=182) -->
      <use href="#block" x="154" y="182" />
      <use href="#block" x="202" y="182" />
      <use href="#block" x="250" y="182" />
      <use href="#block" x="298" y="182" />
      <use href="#block" x="346" y="182" />
      
      <!-- Row 4 (y=230) -->
      <use href="#block" x="106" y="230" />
      <use href="#block" x="154" y="230" />
      <use href="#block" x="202" y="230" />
      <use href="#block" x="250" y="230" />
      <use href="#block" x="298" y="230" />
      <use href="#block" x="346" y="230" />

      <!-- Row 5 (y=278) -->
      <use href="#block" x="58" y="278" />
      <use href="#block" x="106" y="278" />
      <use href="#block" x="154" y="278" />
      <use href="#block" x="202" y="278" />
      <use href="#block" x="250" y="278" />
      <use href="#block" x="298" y="278" />
      <use href="#block" x="346" y="278" />

      <!-- Row 6 (y=326) -->
      <use href="#block" x="58" y="326" />
      <use href="#block" x="106" y="326" />
      <use href="#block" x="154" y="326" />
      <use href="#block" x="202" y="326" />
      <use href="#block" x="250" y="326" />
      <use href="#block" x="298" y="326" />
      <use href="#block" x="346" y="326" />
      <use href="#block" x="394" y="326" />

      <!-- Row 7 (y=374) -->
      <use href="#block" x="58" y="374" />
      <use href="#block" x="106" y="374" />
      <use href="#block" x="154" y="374" />
      <use href="#block" x="202" y="374" />
      <use href="#block" x="346" y="374" />
      <use href="#block" x="394" y="374" />
    </g>
  </g>

  <!-- Bottom Pieces Available to Play -->
  <!-- Piece 1: 3x3 L-Shape -->
  <g transform="translate(63, 460) scale(0.65)" filter="url(#piece-shadow)">
    <use href="#block" x="0" y="0" />
    <use href="#block" x="48" y="0" />
    <use href="#block" x="96" y="0" />
    <use href="#block" x="0" y="48" />
    <use href="#block" x="0" y="96" />
  </g>

  <!-- Piece 2: 2x2 Square -->
  <g transform="translate(200, 475) scale(0.65)" filter="url(#piece-shadow)">
    <use href="#block" x="0" y="0" />
    <use href="#block" x="48" y="0" />
    <use href="#block" x="0" y="48" />
    <use href="#block" x="48" y="48" />
  </g>

  <!-- Piece 3: 4x1 Line -->
  <g transform="translate(320, 480) scale(0.65)" filter="url(#piece-shadow)">
    <use href="#block" x="0" y="0" />
    <use href="#block" x="48" y="0" />
    <use href="#block" x="96" y="0" />
    <use href="#block" x="144" y="0" />
  </g>

</svg>
