<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
  <defs>
    <!-- Background Grid Pattern -->
    <pattern id="grid8" width="56" height="56" patternUnits="userSpaceOnUse" patternTransform="translate(26, 26)">
      <rect width="50" height="50" rx="8" fill="#0f172a" opacity="0.6" />
    </pattern>

    <!-- Liquid Gradients -->
    <linearGradient id="liq-yellow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>

    <linearGradient id="liq-green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#86efac" />
      <stop offset="50%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>

    <linearGradient id="liq-red" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fca5a5" />
      <stop offset="50%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>

    <linearGradient id="liq-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#93c5fd" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1e40af" />
    </linearGradient>

    <!-- Tubes Background Gradient (Empty glass tint) -->
    <linearGradient id="glass-tint" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.0" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.3" />
    </linearGradient>
    
    <!-- Glass Reflection Highlight -->
    <linearGradient id="glass-highlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="20%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Filters -->
    <filter id="board-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="15" stdDeviation="15" flood-color="#000" flood-opacity="0.6"/>
    </filter>
    
    <filter id="piece-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="15" stdDeviation="10" flood-color="#000" flood-opacity="0.6"/>
    </filter>

    <!-- Glass Parts Reusable -->
    <clipPath id="tube-clip">
      <path d="M 8 0 V 240 A 32 32 0 0 0 72 240 V 0 Z" />
    </clipPath>

    <g id="tube-glass-front">
      <!-- Inner shadow / edge definition -->
      <path d="M 8 0 V 240 A 32 32 0 0 0 72 240 V 0" fill="none" stroke="#0f172a" stroke-width="4" opacity="0.3" />
      <!-- Glass body -->
      <path d="M 0 0 V 240 A 40 40 0 0 0 80 240 V 0" fill="none" stroke="#f8fafc" stroke-width="8" stroke-linecap="round" />
      <!-- Top Rim -->
      <path d="M -10 0 H 90" stroke="#f8fafc" stroke-width="12" stroke-linecap="round" />
      <!-- Highlight Reflection -->
      <path d="M 14 10 V 230 A 26 26 0 0 0 30 255 V 10 Z" fill="url(#glass-highlight)" />
      <!-- Secondary thin reflection -->
      <path d="M 66 15 V 235 A 26 26 0 0 1 55 255 V 15 Z" fill="#ffffff" fill-opacity="0.2" />
    </g>

    <!-- Bubble -->
    <g id="bubble">
      <circle cx="0" cy="0" r="4" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.5" />
      <circle cx="-1" cy="-1" r="1.5" fill="#ffffff" opacity="0.8" />
    </g>
  </defs>

  <!-- Board Container (Matches Block Puzzle theme) -->
  <g filter="url(#board-shadow)">
    <rect x="20" y="20" width="460" height="460" rx="30" fill="#1e293b" stroke="#334155" stroke-width="5" />
    <rect x="26" y="26" width="448" height="448" fill="url(#grid8)" opacity="0.8" />
  </g>

  <!-- Tilted Tube (Pouring) -->
  <g transform="translate(150, 20) rotate(60, 40, 140)" filter="url(#piece-shadow)">
    <!-- Back glass tint -->
    <path d="M 8 0 V 240 A 32 32 0 0 0 72 240 V 0 Z" fill="url(#glass-tint)" />
    
    <g clip-path="url(#tube-clip)">
      <!-- Reverse rotation to keep liquid horizontal in world space -->
      <g transform="rotate(-60, 40, 140)">
        <!-- Yellow Liquid (Pouring out) -->
        <rect x="-100" y="105" width="300" height="35" fill="url(#liq-yellow)" />
        <rect x="-100" y="105" width="300" height="4" fill="#fef08a" />
        
        <!-- Green Liquid -->
        <rect x="-100" y="140" width="300" height="120" fill="url(#liq-green)" />
        <rect x="-100" y="140" width="300" height="4" fill="#bbf7d0" />
      </g>
      
      <!-- Bubbles (In tube local space so they align with glass) -->
      <use href="#bubble" x="40" y="140" />
      <use href="#bubble" x="25" y="170" />
      <use href="#bubble" x="60" y="200" />
      <use href="#bubble" x="35" y="220" />
    </g>

    <!-- Front glass -->
    <use href="#tube-glass-front" />
  </g>

  <!-- Standing Tube (Receiving) -->
  <g transform="translate(320, 140)" filter="url(#piece-shadow)">
    <!-- Back glass tint -->
    <path d="M 8 0 V 240 A 32 32 0 0 0 72 240 V 0 Z" fill="url(#glass-tint)" />

    <g clip-path="url(#tube-clip)">
      <!-- Blue Liquid (Bottom) -->
      <rect x="0" y="160" width="80" height="90" fill="url(#liq-blue)" />
      <rect x="0" y="160" width="80" height="4" fill="#bfdbfe" />
      
      <!-- Red Liquid -->
      <rect x="0" y="100" width="80" height="60" fill="url(#liq-red)" />
      <rect x="0" y="100" width="80" height="4" fill="#fecaca" />
      
      <!-- Yellow Liquid (Receiving) -->
      <rect x="0" y="50" width="80" height="50" fill="url(#liq-yellow)" />
      <rect x="0" y="50" width="80" height="4" fill="#fef08a" />

      <!-- Bubbles -->
      <use href="#bubble" x="20" y="180" />
      <use href="#bubble" x="50" y="210" />
      <use href="#bubble" x="35" y="230" />
      <use href="#bubble" x="60" y="120" />
      <use href="#bubble" x="25" y="140" />
      <use href="#bubble" x="40" y="70" />
      <use href="#bubble" x="65" y="85" />
    </g>

    <!-- Pouring Stream (Overlaps the back liquid, behind front glass) -->
    <path d="M 5 -15 Q 5 20 5 50 A 6 6 0 0 0 17 50 Q 17 20 17 -15 Z" fill="#eab308" />
    <path d="M 8 -13 V 48" stroke="#fef08a" stroke-width="2" stroke-linecap="round" opacity="0.8" />
    
    <!-- Splashes at surface -->
    <circle cx="-2" cy="45" r="3" fill="#fef08a" />
    <circle cx="24" cy="48" r="2.5" fill="#fef08a" />
    <circle cx="15" cy="38" r="2" fill="#fef08a" />
    <circle cx="8" cy="50" r="4" fill="#eab308" />

    <!-- Front glass -->
    <use href="#tube-glass-front" />
  </g>
</svg>
