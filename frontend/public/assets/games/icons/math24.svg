<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
  <defs>
    <!-- Background Tray Shadow -->
    <filter id="board-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="15" stdDeviation="15" flood-color="#000" flood-opacity="0.6"/>
    </filter>
    <filter id="card-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#3b82f6" flood-opacity="0.8"/>
    </filter>
    <pattern id="grid8" width="56" height="56" patternUnits="userSpaceOnUse" patternTransform="translate(26, 26)">
      <rect width="50" height="50" rx="8" fill="#0f172a" opacity="0.6" />
    </pattern>
  </defs>

  <!-- Base Tray -->
  <g filter="url(#board-shadow)">
    <rect x="20" y="20" width="460" height="460" rx="30" fill="#1e293b" stroke="#334155" stroke-width="5" />
    <rect x="26" y="26" width="448" height="448" fill="url(#grid8)" opacity="0.3" />
  </g>

  <!-- Board Container -->
  <rect x="65" y="65" width="370" height="370" rx="16" fill="#0f172a" opacity="0.8" stroke="rgba(51, 65, 85, 0.5)" stroke-width="2" />

  <circle cx="250" cy="250" r="50" fill="rgba(51, 65, 85, 0.3)" />
  <text x="250" y="270" font-family="sans-serif" font-size="52" font-weight="900" fill="rgba(255,255,255,0.15)" text-anchor="middle">24</text>

    <g transform="translate(85, 85)" filter="url(#glow)">
      <rect width="100" height="100" rx="16" fill="rgba(30, 58, 138, 0.5)" stroke="#3b82f6" stroke-width="4" />
      <path d="M 10 10 L 90 10" stroke="rgba(255,255,255,0.2)" stroke-width="4" stroke-linecap="round" />
      <text x="50" y="75" font-family="monospace" font-size="64" font-weight="900" fill="#f8fafc" text-anchor="middle">8</text>
    </g>
  
    <g transform="translate(315, 85)" filter="url(#card-shadow)">
      <rect width="100" height="100" rx="16" fill="rgba(30, 41, 59, 0.8)" stroke="#475569" stroke-width="4" />
      <path d="M 10 10 L 90 10" stroke="rgba(255,255,255,0.2)" stroke-width="4" stroke-linecap="round" />
      <text x="50" y="75" font-family="monospace" font-size="64" font-weight="900" fill="#f8fafc" text-anchor="middle">3</text>
    </g>
  
    <g transform="translate(85, 315)" filter="url(#card-shadow)">
      <rect width="100" height="100" rx="16" fill="rgba(30, 41, 59, 0.8)" stroke="#475569" stroke-width="4" />
      <path d="M 10 10 L 90 10" stroke="rgba(255,255,255,0.2)" stroke-width="4" stroke-linecap="round" />
      <text x="50" y="75" font-family="monospace" font-size="64" font-weight="900" fill="#f8fafc" text-anchor="middle">8</text>
    </g>
  
    <g transform="translate(315, 315)" filter="url(#card-shadow)">
      <rect width="100" height="100" rx="16" fill="rgba(30, 41, 59, 0.8)" stroke="#475569" stroke-width="4" />
      <path d="M 10 10 L 90 10" stroke="rgba(255,255,255,0.2)" stroke-width="4" stroke-linecap="round" />
      <text x="50" y="75" font-family="monospace" font-size="64" font-weight="900" fill="#f8fafc" text-anchor="middle">3</text>
    </g>
  
    <g transform="translate(210, 95)" filter="url(#card-shadow)">
      <rect width="80" height="80" rx="12" fill="#020617" stroke="#334155" stroke-width="3" />
      <text x="40" y="58" font-family="sans-serif" font-size="52" font-weight="bold" fill="#94a3b8" text-anchor="middle">+</text>
    </g>
  
    <g transform="translate(210, 325)" filter="url(#card-shadow)">
      <rect width="80" height="80" rx="12" fill="#020617" stroke="#334155" stroke-width="3" />
      <text x="40" y="58" font-family="sans-serif" font-size="52" font-weight="bold" fill="#94a3b8" text-anchor="middle">-</text>
    </g>
  
    <g transform="translate(95, 210)" filter="url(#glow)">
      <rect width="80" height="80" rx="12" fill="#2563eb" stroke="#3b82f6" stroke-width="3" />
      <text x="40" y="58" font-family="sans-serif" font-size="52" font-weight="bold" fill="#ffffff" text-anchor="middle">×</text>
    </g>
  
    <g transform="translate(325, 210)" filter="url(#card-shadow)">
      <rect width="80" height="80" rx="12" fill="#020617" stroke="#334155" stroke-width="3" />
      <text x="40" y="58" font-family="sans-serif" font-size="52" font-weight="bold" fill="#94a3b8" text-anchor="middle">÷</text>
    </g>
  </svg>