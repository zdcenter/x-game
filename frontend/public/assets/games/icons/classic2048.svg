<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
  <defs>
    <!-- Background Tray Shadow -->
    <filter id="board-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="15" stdDeviation="15" flood-color="#000" flood-opacity="0.6"/>
    </filter>
    <filter id="tile-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    
    <!-- Gradients for different tiles -->
    <linearGradient id="grad-empty" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Lower numbers -->
    <linearGradient id="grad-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Mid numbers -->
    <linearGradient id="grad-orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>

    <!-- High numbers (2048) -->
    <linearGradient id="grad-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Glow for 2048 -->
    <filter id="glow-gold" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Tray -->
  <g filter="url(#board-shadow)">
    <rect x="20" y="20" width="460" height="460" rx="30" fill="#0f172a" stroke="#1e293b" stroke-width="5" />
  </g>

  <!-- Grid Background (Empty cells) -->
  <rect x="36" y="36" width="98" height="98" rx="16" fill="url(#grad-empty)" />
  <rect x="146" y="36" width="98" height="98" rx="16" fill="url(#grad-empty)" />
  <rect x="256" y="36" width="98" height="98" rx="16" fill="url(#grad-empty)" />
  <rect x="366" y="36" width="98" height="98" rx="16" fill="url(#grad-empty)" />

  <rect x="36" y="146" width="98" height="98" rx="16" fill="url(#grad-empty)" />
  <rect x="146" y="146" width="98" height="98" rx="16" fill="url(#grad-empty)" />
  <rect x="256" y="146" width="98" height="98" rx="16" fill="url(#grad-empty)" />
  <rect x="366" y="146" width="98" height="98" rx="16" fill="url(#grad-empty)" />

  <rect x="36" y="256" width="98" height="98" rx="16" fill="url(#grad-empty)" />
  <rect x="146" y="256" width="98" height="98" rx="16" fill="url(#grad-empty)" />
  <rect x="256" y="256" width="98" height="98" rx="16" fill="url(#grad-empty)" />
  <rect x="366" y="256" width="98" height="98" rx="16" fill="url(#grad-empty)" />

  <rect x="36" y="366" width="98" height="98" rx="16" fill="url(#grad-empty)" />
  <rect x="146" y="366" width="98" height="98" rx="16" fill="url(#grad-empty)" />
  <rect x="256" y="366" width="98" height="98" rx="16" fill="url(#grad-empty)" />
  <rect x="366" y="366" width="98" height="98" rx="16" fill="url(#grad-empty)" />

  <!-- Filled Tiles -->
  
  <!-- Tile 2 -->
  <g transform="translate(146, 256)" filter="url(#tile-shadow)">
    <rect x="0" y="0" width="98" height="98" rx="16" fill="#1e293b" />
    <rect x="0" y="0" width="98" height="92" rx="16" fill="url(#grad-2)" stroke="rgba(255,255,255,0.1)" stroke-width="2" />
    <text x="49" y="62" font-family="sans-serif" font-weight="900" font-size="36" fill="#f8fafc" text-anchor="middle">2</text>
  </g>

  <!-- Tile 4 -->
  <g transform="translate(366, 146)" filter="url(#tile-shadow)">
    <rect x="0" y="0" width="98" height="98" rx="16" fill="#1e293b" />
    <rect x="0" y="0" width="98" height="92" rx="16" fill="url(#grad-2)" stroke="rgba(255,255,255,0.1)" stroke-width="2" />
    <text x="49" y="62" font-family="sans-serif" font-weight="900" font-size="36" fill="#f8fafc" text-anchor="middle">4</text>
  </g>

  <!-- Tile 8 -->
  <g transform="translate(36, 146)" filter="url(#tile-shadow)">
    <rect x="0" y="0" width="98" height="98" rx="16" fill="#1e293b" />
    <rect x="0" y="0" width="98" height="92" rx="16" fill="url(#grad-orange)" stroke="rgba(255,255,255,0.2)" stroke-width="2" />
    <text x="49" y="62" font-family="sans-serif" font-weight="900" font-size="36" fill="#fff" text-anchor="middle">8</text>
  </g>

  <!-- Tile 128 -->
  <g transform="translate(146, 146)" filter="url(#tile-shadow)">
    <rect x="0" y="0" width="98" height="98" rx="16" fill="#1e293b" />
    <rect x="0" y="0" width="98" height="92" rx="16" fill="url(#grad-orange)" stroke="rgba(255,255,255,0.2)" stroke-width="2" />
    <text x="49" y="60" font-family="sans-serif" font-weight="900" font-size="32" fill="#fff" text-anchor="middle">128</text>
  </g>

  <!-- Tile 512 -->
  <g transform="translate(256, 256)" filter="url(#tile-shadow)">
    <rect x="0" y="0" width="98" height="98" rx="16" fill="#92400e" />
    <rect x="0" y="0" width="98" height="92" rx="16" fill="url(#grad-gold)" stroke="rgba(255,255,255,0.3)" stroke-width="2" />
    <text x="49" y="60" font-family="sans-serif" font-weight="900" font-size="32" fill="#fff" text-anchor="middle">512</text>
  </g>

  <!-- Tile 2048 (Highlighted & Glowing) -->
  <g transform="translate(256, 146)" filter="url(#tile-shadow)">
    <rect x="0" y="0" width="98" height="98" rx="16" fill="#92400e" filter="url(#glow-gold)" />
    <rect x="0" y="0" width="98" height="92" rx="16" fill="url(#grad-gold)" stroke="rgba(255,255,255,0.5)" stroke-width="2.5" />
    <text x="49" y="60" font-family="sans-serif" font-weight="900" font-size="28" fill="#fff" text-anchor="middle">2048</text>
  </g>

</svg>
