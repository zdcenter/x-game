<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
  <defs>
    <!-- Background Tray Shadow -->
    <filter id="board-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="15" stdDeviation="15" flood-color="#000" flood-opacity="0.6"/>
    </filter>

    <!-- Piece Drop Shadow -->
    <filter id="piece-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#000" flood-opacity="0.5"/>
    </filter>

    <pattern id="grid8" width="56" height="56" patternUnits="userSpaceOnUse" patternTransform="translate(26, 26)">
      <rect width="50" height="50" rx="8" fill="#0f172a" opacity="0.6" />
    </pattern>

    <!-- Game Colors -->
    <!-- Amber Gradient (Pieces) -->
    <linearGradient id="piece-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Blue Gradient (Other Pieces) -->
    <linearGradient id="piece-blue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- Red Gradient (Other Pieces) -->
    <linearGradient id="piece-red" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
    
    <g id="hex-empty">
      <polygon points="18.2,10.5 0,21 -18.2,10.5 -18.2,-10.5 0,-21 18.2,-10.5" fill="#1e293b" stroke="rgba(100, 116, 139, 0.5)" stroke-width="1.5" />
    </g>
    
    <g id="hex-amber">
      <polygon points="18.2,10.5 0,21 -18.2,10.5 -18.2,-10.5 0,-21 18.2,-10.5" fill="url(#piece-grad)" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" />
      <polygon points="18.2,10.5 0,21 -18.2,10.5 -18.2,-10.5 0,-21 18.2,-10.5" fill="none" stroke="#fef3c7" stroke-width="3" opacity="0.4" />
    </g>

    <g id="hex-blue">
      <polygon points="18.2,10.5 0,21 -18.2,10.5 -18.2,-10.5 0,-21 18.2,-10.5" fill="url(#piece-blue)" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" />
      <polygon points="18.2,10.5 0,21 -18.2,10.5 -18.2,-10.5 0,-21 18.2,-10.5" fill="none" stroke="#bfdbfe" stroke-width="3" opacity="0.4" />
    </g>

    <g id="hex-red">
      <polygon points="18.2,10.5 0,21 -18.2,10.5 -18.2,-10.5 0,-21 18.2,-10.5" fill="url(#piece-red)" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" />
      <polygon points="18.2,10.5 0,21 -18.2,10.5 -18.2,-10.5 0,-21 18.2,-10.5" fill="none" stroke="#fecaca" stroke-width="3" opacity="0.4" />
    </g>
  </defs>

  <!-- Base Tray -->
  <g filter="url(#board-shadow)">
    <rect x="20" y="20" width="460" height="460" rx="30" fill="#1e293b" stroke="#334155" stroke-width="5" />
    <rect x="26" y="26" width="448" height="448" fill="url(#grid8)" opacity="0.4" />
  </g>

  <!-- Empty Grid Board -->
  <g transform="translate(250, 210)">
    <use href="#hex-empty" x="-145.5" y="0.0" />
    <use href="#hex-empty" x="-127.3" y="31.5" />
    <use href="#hex-empty" x="-109.1" y="63.0" />
    <use href="#hex-empty" x="-90.9" y="94.5" />
    <use href="#hex-empty" x="-72.7" y="126.0" />
    <use href="#hex-empty" x="-127.3" y="-31.5" />
    <use href="#hex-empty" x="-109.1" y="0.0" />
    <use href="#hex-empty" x="-90.9" y="31.5" />
    <use href="#hex-empty" x="-72.7" y="63.0" />
    <use href="#hex-empty" x="-54.6" y="94.5" />
    <use href="#hex-empty" x="-36.4" y="126.0" />
    <use href="#hex-empty" x="-109.1" y="-63.0" />
    <use href="#hex-empty" x="-90.9" y="-31.5" />
    <use href="#hex-empty" x="-72.7" y="0.0" />
    <use href="#hex-empty" x="-54.6" y="31.5" />
    <use href="#hex-empty" x="-36.4" y="63.0" />
    <use href="#hex-empty" x="-18.2" y="94.5" />
    <use href="#hex-empty" x="0.0" y="126.0" />
    <use href="#hex-empty" x="-90.9" y="-94.5" />
    <use href="#hex-empty" x="-72.7" y="-63.0" />
    <use href="#hex-empty" x="-54.6" y="-31.5" />
    <use href="#hex-empty" x="-36.4" y="0.0" />
    <use href="#hex-empty" x="-18.2" y="31.5" />
    <use href="#hex-empty" x="0.0" y="63.0" />
    <use href="#hex-empty" x="18.2" y="94.5" />
    <use href="#hex-empty" x="36.4" y="126.0" />
    <use href="#hex-empty" x="-72.7" y="-126.0" />
    <use href="#hex-empty" x="-54.6" y="-94.5" />
    <use href="#hex-empty" x="-36.4" y="-63.0" />
    <use href="#hex-empty" x="-18.2" y="-31.5" />
    <use href="#hex-empty" x="0.0" y="0.0" />
    <use href="#hex-empty" x="18.2" y="31.5" />
    <use href="#hex-empty" x="36.4" y="63.0" />
    <use href="#hex-empty" x="54.6" y="94.5" />
    <use href="#hex-empty" x="72.7" y="126.0" />
    <use href="#hex-empty" x="-36.4" y="-126.0" />
    <use href="#hex-empty" x="-18.2" y="-94.5" />
    <use href="#hex-empty" x="0.0" y="-63.0" />
    <use href="#hex-empty" x="18.2" y="-31.5" />
    <use href="#hex-empty" x="36.4" y="0.0" />
    <use href="#hex-empty" x="54.6" y="31.5" />
    <use href="#hex-empty" x="72.7" y="63.0" />
    <use href="#hex-empty" x="90.9" y="94.5" />
    <use href="#hex-empty" x="0.0" y="-126.0" />
    <use href="#hex-empty" x="18.2" y="-94.5" />
    <use href="#hex-empty" x="36.4" y="-63.0" />
    <use href="#hex-empty" x="54.6" y="-31.5" />
    <use href="#hex-empty" x="72.7" y="0.0" />
    <use href="#hex-empty" x="90.9" y="31.5" />
    <use href="#hex-empty" x="109.1" y="63.0" />
    <use href="#hex-empty" x="36.4" y="-126.0" />
    <use href="#hex-empty" x="54.6" y="-94.5" />
    <use href="#hex-empty" x="72.7" y="-63.0" />
    <use href="#hex-empty" x="90.9" y="-31.5" />
    <use href="#hex-empty" x="109.1" y="0.0" />
    <use href="#hex-empty" x="127.3" y="31.5" />
    <use href="#hex-empty" x="72.7" y="-126.0" />
    <use href="#hex-empty" x="90.9" y="-94.5" />
    <use href="#hex-empty" x="109.1" y="-63.0" />
    <use href="#hex-empty" x="127.3" y="-31.5" />
    <use href="#hex-empty" x="145.5" y="0.0" />
  </g>
  <g transform="translate(250, 210)" filter="url(#piece-shadow)">
    <use href="#hex-red" x="0.0" y="0.0" />
    <use href="#hex-red" x="18.2" y="-31.5" />
    <use href="#hex-red" x="-18.2" y="31.5" />
    <use href="#hex-red" x="-18.2" y="-31.5" />
    <use href="#hex-blue" x="-72.7" y="0.0" />
    <use href="#hex-blue" x="-54.6" y="31.5" />
    <use href="#hex-blue" x="-90.9" y="31.5" />
    <use href="#hex-blue" x="-36.4" y="0.0" />
    <use href="#hex-amber" x="36.4" y="-63.0" />
    <use href="#hex-amber" x="72.7" y="-63.0" />
    <use href="#hex-amber" x="54.6" y="-94.5" />
    <use href="#hex-amber" x="54.6" y="-31.5" />
    <use href="#hex-red" x="36.4" y="63.0" />
    <use href="#hex-red" x="72.7" y="63.0" />
    <use href="#hex-red" x="54.6" y="94.5" />
    <use href="#hex-blue" x="90.9" y="31.5" />
    <use href="#hex-blue" x="109.1" y="0.0" />
    <use href="#hex-blue" x="109.1" y="63.0" />
  </g>

  <g filter="url(#piece-shadow)">
    <!-- Left Piece (Blue Line) -->
    <g transform="translate(120, 410) scale(0.8)">
      <use href="#hex-blue" x="-36.4" y="0" />
      <use href="#hex-blue" x="0" y="0" />
      <use href="#hex-blue" x="36.4" y="0" />
      <use href="#hex-blue" x="72.8" y="0" />
    </g>
    
    <!-- Center Piece (Amber Triangle) -->
    <g transform="translate(250, 420) scale(0.8)">
      <use href="#hex-amber" x="0" y="-31.5" />
      <use href="#hex-amber" x="-18.2" y="0" />
      <use href="#hex-amber" x="18.2" y="0" />
    </g>

    <!-- Right Piece (Red Corner) hovered up a bit -->
    <g transform="translate(380, 395) scale(0.9)">
      <use href="#hex-red" x="0" y="0" />
      <use href="#hex-red" x="36.4" y="0" />
      <use href="#hex-red" x="18.2" y="-31.5" />
      <use href="#hex-red" x="-18.2" y="-31.5" />
    </g>
  </g>
</svg>