<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    
    <!-- Box Gradients -->
    <linearGradient id="box-top" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="box-front" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="box-side" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>

    <!-- Floor Gradient -->
    <linearGradient id="floor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Wall Gradients -->
    <linearGradient id="wall-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="wall-front" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="15" stdDeviation="15" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="100" fill="url(#bg-grad)"/>
  
  <!-- Outer Floor area -->
  <path d="M 80 256 L 256 120 L 432 256 L 256 392 Z" fill="url(#floor)" filter="url(#shadow)"/>
  
  <!-- Grid Lines for Floor -->
  <path d="M 168 256 L 256 188 L 344 256 L 256 324 Z" fill="none" stroke="#334155" stroke-width="4"/>
  <path d="M 212 222 L 300 290" fill="none" stroke="#334155" stroke-width="4"/>
  <path d="M 300 222 L 212 290" fill="none" stroke="#334155" stroke-width="4"/>

  <!-- Back Wall -->
  <path d="M 168 188 L 256 120 L 344 188 L 256 256 Z" fill="url(#wall-top)"/>
  <path d="M 168 188 L 256 256 L 256 296 L 168 228 Z" fill="url(#wall-front)"/>
  <path d="M 256 256 L 344 188 L 344 228 L 256 296 Z" fill="#1e293b"/>

  <!-- Target Indicator (Glowing Green dot) -->
  <ellipse cx="256" cy="324" rx="25" ry="12" fill="#10b981" opacity="0.6"/>
  <ellipse cx="256" cy="324" rx="15" ry="7" fill="#34d399"/>

  <!-- Box 3D -->
  <!-- Box Top -->
  <path d="M 212 222 L 256 188 L 300 222 L 256 256 Z" fill="url(#box-top)"/>
  <!-- Box Front Left -->
  <path d="M 212 222 L 256 256 L 256 310 L 212 276 Z" fill="url(#box-front)"/>
  <!-- Box Front Right -->
  <path d="M 256 256 L 300 222 L 300 276 L 256 310 Z" fill="url(#box-side)"/>

  <!-- Box details (Tape/Straps) -->
  <path d="M 234 239 L 278 205 M 234 205 L 278 239" stroke="#92400e" stroke-width="4"/>
  <path d="M 234 276 L 234 239 L 256 256" stroke="#fcd34d" stroke-width="3" fill="none" opacity="0.5"/>
</svg>
