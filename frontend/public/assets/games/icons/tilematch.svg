<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- 全局柔和外投影 -->
    <filter id="board-shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0f2905" flood-opacity="0.38"/>
    </filter>
    <filter id="tile-shadow" x="-20%" y="-15%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="4.5" flood-color="#143408" flood-opacity="0.32"/>
    </filter>
    <filter id="gold-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#facc15" flood-opacity="0.85"/>
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#ca8a04" flood-opacity="0.4"/>
    </filter>
    <filter id="slot-inner-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#170c03" flood-opacity="0.6"/>
    </filter>

    <!-- 1:1 游戏大草坪纯正清新渐变 -->
    <linearGradient id="meadow-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c5f583"/>
      <stop offset="45%" stop-color="#b7ef71"/>
      <stop offset="100%" stop-color="#a4e75a"/>
    </linearGradient>

    <!-- 木栅栏实木渐变 -->
    <linearGradient id="fence-rail-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b6753c"/>
      <stop offset="25%" stop-color="#965a28"/>
      <stop offset="80%" stop-color="#693b14"/>
      <stop offset="100%" stop-color="#4e280b"/>
    </linearGradient>
    <linearGradient id="fence-post-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9a5e2d"/>
      <stop offset="40%" stop-color="#be7f44"/>
      <stop offset="70%" stop-color="#8a4f22"/>
      <stop offset="100%" stop-color="#673612"/>
    </linearGradient>

    <!-- 白玉关卡胶囊渐变 -->
    <linearGradient id="capsule-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f9eb"/>
    </linearGradient>

    <!-- 经典蓝色道具按钮渐变 -->
    <linearGradient id="tool-btn-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- ================= 核心白玉麻将牌通用模版 ================= -->
    <!-- 宽 58, 高 70, 圆角 10, 墨绿立体厚底 4px -->
    <g id="tile-card">
      <!-- 墨绿立体背衬底座 -->
      <rect x="0" y="4" width="58" height="70" rx="10" fill="#3a7122"/>
      <!-- 正面象牙白牌身 -->
      <rect x="0" y="0" width="58" height="66" rx="10" fill="#ffffff" stroke="#233714" stroke-width="1.5"/>
      <!-- 内边缘微高光 -->
      <rect x="2" y="2" width="54" height="26" rx="8" fill="#ffffff" opacity="0.6"/>
    </g>

    <!-- 牌槽内紧凑小牌 (宽 44, 高 54) -->
    <g id="tile-slot-card">
      <rect x="0" y="3" width="44" height="54" rx="8" fill="#3a7122"/>
      <rect x="0" y="0" width="44" height="51" rx="8" fill="#ffffff" stroke="#233714" stroke-width="1.3"/>
      <rect x="1.5" y="1.5" width="41" height="20" rx="6" fill="#ffffff" opacity="0.6"/>
    </g>

    <!-- 被遮挡卡牌的暗绿色遮罩 -->
    <g id="tile-blocked-mask">
      <rect x="0" y="0" width="58" height="66" rx="10" fill="#1b3711" opacity="0.52"/>
    </g>

    <!-- ================= 经典农场图腾矢量绘制 ================= -->
    <!-- 1. 胡萝卜 🥕 -->
    <g id="icon-carrot">
      <!-- 翠绿顶叶 -->
      <path d="M29 18 C28 11, 33 6, 37 5 C35 11, 32 15, 29 19 Z" fill="#22c55e"/>
      <path d="M27 17 C24 9, 19 6, 17 5 C19 11, 23 15, 26 19 Z" fill="#16a34a"/>
      <path d="M28 16 C28 7, 29 4, 30 3 C31 8, 30 13, 28 16 Z" fill="#4ade80"/>
      <!-- 饱满橙色身体 -->
      <path d="M19 19 C21 16, 37 16, 39 19 C40 24, 33 46, 29 52 C25 46, 18 24, 19 19 Z" fill="#f97316" stroke="#c2410c" stroke-width="1"/>
      <path d="M23 19 C23 19, 35 19, 37 21 C36 30, 31 46, 29 50 C28 46, 23 28, 23 19 Z" fill="#fb923c"/>
      <!-- 横向纹理 -->
      <path d="M23 25 Q28 27 34 25" stroke="#ea580c" stroke-width="1.8" stroke-linecap="round" fill="none"/>
      <path d="M24 33 Q29 35 33 33" stroke="#ea580c" stroke-width="1.6" stroke-linecap="round" fill="none"/>
      <path d="M26 41 Q29 42 32 41" stroke="#ea580c" stroke-width="1.4" stroke-linecap="round" fill="none"/>
    </g>

    <!-- 2. 金色铃铛 🔔 -->
    <g id="icon-bell">
      <path d="M29 16 C22 16, 20 25, 18 32 C16 38, 14 39, 14 42 C14 44, 20 44, 29 44 C38 44, 44 44, 44 42 C44 39, 42 38, 40 32 C38 25, 36 16, 29 16 Z" fill="#eab308" stroke="#a16207" stroke-width="1"/>
      <path d="M29 18 C24 18, 22 25, 20 32 C19 35, 17 38, 16 40 C20 41, 37 41, 41 40 C40 38, 38 35, 37 32 C35 25, 34 18, 29 18 Z" fill="#facc15"/>
      <circle cx="29" cy="45" r="3.5" fill="#ca8a04"/>
      <circle cx="29" cy="14" r="3.2" fill="none" stroke="#ca8a04" stroke-width="2"/>
    </g>

    <!-- 3. 浅蓝手套 🧤 -->
    <g id="icon-glove">
      <!-- 主掌部 -->
      <path d="M19 23 C19 16, 27 15, 29 21 C30 15, 38 16, 38 23 C38 29, 39 37, 37 41 L20 41 C19 37, 19 29, 19 23 Z" fill="#38bdf8" stroke="#0284c7" stroke-width="1"/>
      <!-- 大拇指 -->
      <path d="M19 27 C15 27, 13 32, 16 35 C18 37, 20 36, 21 34 Z" fill="#38bdf8" stroke="#0284c7" stroke-width="1"/>
      <path d="M21 21 C21 17, 26 17, 27 22" fill="#7dd3fc"/>
      <!-- 罗纹腕口 -->
      <rect x="19" y="41" width="19" height="7" rx="2" fill="#0284c7"/>
      <line x1="23" y1="41" x2="23" y2="48" stroke="#e0f2fe" stroke-width="1"/>
      <line x1="28" y1="41" x2="28" y2="48" stroke="#e0f2fe" stroke-width="1"/>
      <line x1="33" y1="41" x2="33" y2="48" stroke="#e0f2fe" stroke-width="1"/>
    </g>

    <!-- 4. 绿草枝叶 🌿 -->
    <g id="icon-leaf">
      <path d="M29 48 Q29 32 23 16" stroke="#15803d" stroke-width="2.5" stroke-linecap="round" fill="none"/>
      <!-- 叶片群 -->
      <path d="M25 18 C23 12, 17 11, 14 13 C17 18, 22 19, 25 18 Z" fill="#22c55e"/>
      <path d="M25 21 C29 16, 35 16, 37 19 C33 23, 28 23, 25 21 Z" fill="#16a34a"/>
      <path d="M26 28 C22 24, 16 25, 14 28 C18 31, 23 30, 26 28 Z" fill="#22c55e"/>
      <path d="M27 31 C32 28, 38 29, 39 33 C35 35, 30 34, 27 31 Z" fill="#16a34a"/>
      <path d="M28 38 C24 36, 19 37, 18 41 C22 42, 26 41, 28 38 Z" fill="#4ade80"/>
    </g>

    <!-- 5. 呆萌小羊 🐑 -->
    <g id="icon-sheep">
      <circle cx="21" cy="30" r="7" fill="#f1f5f9"/>
      <circle cx="37" cy="30" r="7" fill="#f1f5f9"/>
      <circle cx="29" cy="24" r="8" fill="#ffffff"/>
      <circle cx="29" cy="34" r="8" fill="#f8fafc"/>
      <!-- 黑脸 -->
      <rect x="23" y="24" width="12" height="15" rx="6" fill="#1e293b"/>
      <!-- 羊耳朵 -->
      <ellipse cx="19" cy="27" rx="3.5" ry="2" fill="#334155" transform="rotate(-20 19 27)"/>
      <ellipse cx="39" cy="27" rx="3.5" ry="2" fill="#334155" transform="rotate(20 39 27)"/>
      <!-- 眼睛点点 -->
      <circle cx="26" cy="29" r="1.1" fill="#ffffff"/>
      <circle cx="32" cy="29" r="1.1" fill="#ffffff"/>
      <circle cx="26.3" cy="29" r="0.5" fill="#000000"/>
      <circle cx="32.3" cy="29" r="0.5" fill="#000000"/>
      <!-- 腮红 -->
      <circle cx="25" cy="33" r="1.2" fill="#fb7185" opacity="0.8"/>
      <circle cx="33" cy="33" r="1.2" fill="#fb7185" opacity="0.8"/>
    </g>

    <!-- 槽内缩放版胡萝卜 -->
    <g id="icon-carrot-small" transform="scale(0.76) translate(-2, -1)">
      <use href="#icon-carrot"/>
    </g>

    <!-- 多巴胺闪烁小星光 ✨ -->
    <g id="sparkle">
      <path d="M0 -6 Q0 0 6 0 Q0 0 0 6 Q0 0 -6 0 Q0 0 0 -6 Z" fill="#fef08a"/>
    </g>

    <!-- 游戏内 1:1 手绘纯正小草丛 -->
    <g id="grass-tuft">
      <path d="M4 18 C5 12 8 7 11 4 M13 18 C13 10 15 5 18 2 M21 18 C20 13 19 8 16 5" 
            stroke="#4d8525" stroke-width="2.2" stroke-linecap="round" fill="none"/>
    </g>
  </defs>

  <!-- ================= 1. 外层通用圆角大卡底盘 ================= -->
  <g filter="url(#board-shadow)">
    <!-- 卡片主体外框 (遵循全站 460x460 居中规格，清新大草坪绿意) -->
    <rect x="20" y="20" width="460" height="460" rx="38" fill="url(#meadow-grad)" stroke="#4d8b2e" stroke-width="5" stroke-opacity="0.5"/>
  </g>

  <!-- ================= 2. 田园四周散落的手绘小草丛点缀 (与游戏内 1:1 一致) ================= -->
  <use href="#grass-tuft" x="38" y="32" transform="scale(1.2)"/>
  <use href="#grass-tuft" x="420" y="32" transform="scale(1.2)"/>
  <use href="#grass-tuft" x="32" y="210" transform="scale(1.1)"/>
  <use href="#grass-tuft" x="426" y="215" transform="scale(1.1)"/>
  <use href="#grass-tuft" x="36" y="425" transform="scale(1.2)"/>
  <use href="#grass-tuft" x="422" y="425" transform="scale(1.2)"/>

  <!-- ================= 3. 顶部：田园白玉微立体关卡胶囊 ================= -->
  <g transform="translate(175, 34)" filter="url(#tile-shadow)">
    <!-- 胶囊外壳 -->
    <rect x="0" y="0" width="150" height="30" rx="15" fill="url(#capsule-grad)" stroke="#65a30d" stroke-width="1.5"/>
    <!-- 左切关箭头 -->
    <path d="M16 15 L21 10 L21 20 Z" fill="#4d7c0f"/>
    <!-- 右切关箭头 -->
    <path d="M134 15 L129 10 L129 20 Z" fill="#4d7c0f"/>
    <!-- 标题文字 -->
    <text x="75" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="900" fill="#14532d" text-anchor="middle" letter-spacing="0.5">🌱 第 2 关 · 挑战</text>
  </g>

  <!-- ================= 4. 核心主棋盘：AABB 叠层 3D 白玉牌阵 (The Mahjong Pyramid) ================= -->
  <!-- Layer 0：底层受遮挡暗影牌 (Blocked Tiles - 羊了个羊标志性机制) -->
  <g filter="url(#tile-shadow)" transform="translate(85, 78)">
    <use href="#tile-card"/>
    <use href="#icon-glove"/>
    <use href="#tile-blocked-mask"/>
  </g>
  <g filter="url(#tile-shadow)" transform="translate(357, 78)">
    <use href="#tile-card"/>
    <use href="#icon-carrot"/>
    <use href="#tile-blocked-mask"/>
  </g>
  <g filter="url(#tile-shadow)" transform="translate(118, 138)">
    <use href="#tile-card"/>
    <use href="#icon-leaf"/>
    <use href="#tile-blocked-mask"/>
  </g>
  <g filter="url(#tile-shadow)" transform="translate(324, 138)">
    <use href="#tile-card"/>
    <use href="#icon-bell"/>
    <use href="#tile-blocked-mask"/>
  </g>

  <!-- Layer 1：中间层错位半步叠放牌 -->
  <g filter="url(#tile-shadow)" transform="translate(156, 88)">
    <use href="#tile-card"/>
    <use href="#icon-bell"/>
    <use href="#tile-blocked-mask"/>
  </g>
  <g filter="url(#tile-shadow)" transform="translate(286, 88)">
    <use href="#tile-card"/>
    <use href="#icon-sheep"/>
    <use href="#tile-blocked-mask"/>
  </g>
  <g filter="url(#tile-shadow)" transform="translate(162, 150)">
    <use href="#tile-card"/>
    <use href="#icon-glove"/>
    <!-- 亮牌：可点击 -->
  </g>
  <g filter="url(#tile-shadow)" transform="translate(280, 150)">
    <use href="#tile-card"/>
    <use href="#icon-leaf"/>
    <!-- 亮牌：可点击 -->
  </g>

  <!-- Layer 2：顶层明牌与明星牌 -->
  <!-- 顶层牌 1：铃铛 (高亮明亮) -->
  <g filter="url(#tile-shadow)" transform="translate(221, 80)">
    <use href="#tile-card"/>
    <use href="#icon-bell"/>
  </g>

  <!-- 顶层核心焦点牌：鲜嫩胡萝卜 (正在被选取的微动感卡牌，金色高光环绕，指引点击！) -->
  <g filter="url(#gold-glow)" transform="translate(221, 144)">
    <use href="#tile-card"/>
    <use href="#icon-carrot"/>
    <!-- 金色焦点选取环 -->
    <rect x="0" y="0" width="58" height="66" rx="10" fill="none" stroke="#facc15" stroke-width="2.5"/>
    <use href="#sparkle" x="8" y="10" transform="scale(1.1)"/>
    <use href="#sparkle" x="50" y="20" transform="scale(0.9)"/>
  </g>


  <!-- ================= 5. 下方：1:1 原版卡通小木栅栏卡槽 (7-Slot Wood Fence Tray) ================= -->
  <g transform="translate(42, 255)">
    <!-- 托盘投影与草坪基座 -->
    <g filter="url(#board-shadow)">
      <rect x="8" y="14" width="400" height="88" rx="18" fill="#2d1a08" opacity="0.35"/>
      <!-- 卡槽深色木质凹槽内底 -->
      <rect x="16" y="18" width="384" height="80" rx="12" fill="#3a1e08" stroke="#251203" stroke-width="2.5"/>
    </g>

    <!-- 7 个木质卡槽凹槽背景 (内阴影立体) -->
    <g filter="url(#slot-inner-shadow)">
      <!-- 格 1 -->
      <rect x="25" y="24" width="46" height="68" rx="7" fill="#291404" stroke="#4a2608" stroke-width="1.5"/>
      <!-- 格 2 -->
      <rect x="77" y="24" width="46" height="68" rx="7" fill="#291404" stroke="#4a2608" stroke-width="1.5"/>
      <!-- 格 3 -->
      <rect x="129" y="24" width="46" height="68" rx="7" fill="#291404" stroke="#4a2608" stroke-width="1.5"/>
      <!-- 格 4 -->
      <rect x="181" y="24" width="46" height="68" rx="7" fill="#291404" stroke="#4a2608" stroke-width="1.5"/>
      <!-- 格 5 -->
      <rect x="233" y="24" width="46" height="68" rx="7" fill="#291404" stroke="#4a2608" stroke-width="1.5"/>
      <!-- 格 6 -->
      <rect x="285" y="24" width="46" height="68" rx="7" fill="#291404" stroke="#4a2608" stroke-width="1.5"/>
      <!-- 格 7 -->
      <rect x="337" y="24" width="46" height="68" rx="7" fill="#291404" stroke="#4a2608" stroke-width="1.5"/>
    </g>

    <!-- 槽内已放入卡牌：2 张胡萝卜已在槽内就位！只差上方选取的第 3 张即刻 3 连消除！(游戏灵魂时刻) -->
    <!-- 槽内第 1 张：胡萝卜 -->
    <g transform="translate(26, 31)" filter="url(#tile-shadow)">
      <use href="#tile-slot-card"/>
      <use href="#icon-carrot-small"/>
    </g>
    <!-- 槽内第 2 张：胡萝卜 -->
    <g transform="translate(78, 31)" filter="url(#tile-shadow)">
      <use href="#tile-slot-card"/>
      <use href="#icon-carrot-small"/>
    </g>

    <!-- 槽内第 3 格：金光跳跃引导虚线 (暗示第 3 张即将落入触发三消！) -->
    <g transform="translate(129, 24)">
      <rect x="2" y="2" width="42" height="64" rx="6" fill="#fbbf24" fill-opacity="0.15" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 3"/>
      <use href="#sparkle" x="23" y="34" transform="scale(1.2)"/>
    </g>

    <!-- 标志性卡通小木栅栏：上下横梁 (Rails) -->
    <!-- 下木梁 -->
    <rect x="12" y="88" width="392" height="15" rx="5" fill="url(#fence-rail-grad)" stroke="#381b05" stroke-width="1.8"/>
    <path d="M14 91 L402 91" stroke="#d59958" stroke-width="1.2" opacity="0.6"/>
    <!-- 上木梁 -->
    <rect x="12" y="11" width="392" height="15" rx="5" fill="url(#fence-rail-grad)" stroke="#381b05" stroke-width="1.8"/>
    <path d="M14 14 L402 14" stroke="#d59958" stroke-width="1.2" opacity="0.6"/>

    <!-- 左右两根标志性圆头木桩 (Posts & Caps) -->
    <!-- 左木桩 -->
    <g transform="translate(2, 4)">
      <rect x="0" y="5" width="16" height="96" rx="4" fill="url(#fence-post-grad)" stroke="#301502" stroke-width="1.8"/>
      <ellipse cx="8" cy="5" rx="10" ry="5.5" fill="#c68a48" stroke="#301502" stroke-width="1.8"/>
      <ellipse cx="8" cy="4" rx="7" ry="3" fill="#e9b97b" opacity="0.7"/>
    </g>
    <!-- 右木桩 -->
    <g transform="translate(398, 4)">
      <rect x="0" y="5" width="16" height="96" rx="4" fill="url(#fence-post-grad)" stroke="#301502" stroke-width="1.8"/>
      <ellipse cx="8" cy="5" rx="10" ry="5.5" fill="#c68a48" stroke="#301502" stroke-width="1.8"/>
      <ellipse cx="8" cy="4" rx="7" ry="3" fill="#e9b97b" opacity="0.7"/>
    </g>
  </g>


  <!-- ================= 6. 底部：游戏三大标志性天蓝色锦囊道具栏 (移出 / 撤销 / 洗牌) ================= -->
  <g transform="translate(100, 395)" filter="url(#tile-shadow)">
    <!-- 1. 移出 📤 -->
    <g transform="translate(0, 0)">
      <!-- 3D 蓝色胶囊底座 -->
      <rect x="0" y="3" width="84" height="42" rx="12" fill="#0369a1"/>
      <rect x="0" y="0" width="84" height="40" rx="12" fill="url(#tool-btn-grad)" stroke="#0284c7" stroke-width="1.5"/>
      <path d="M2 2 L82 2" stroke="#7dd3fc" stroke-width="1.5" opacity="0.6"/>
      <!-- 向上移出箭头 -->
      <path d="M42 12 L33 21 L38 21 L38 29 L46 29 L46 21 L51 21 Z" fill="#ffffff"/>
      <!-- 右上角小加号气泡 -->
      <circle cx="76" cy="6" r="6" fill="#1e293b" stroke="#ffffff" stroke-width="1.2"/>
      <path d="M73 6 L79 6 M76 3 L76 9" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round"/>
    </g>

    <!-- 2. 撤销 ↩️ -->
    <g transform="translate(108, 0)">
      <rect x="0" y="3" width="84" height="42" rx="12" fill="#0369a1"/>
      <rect x="0" y="0" width="84" height="40" rx="12" fill="url(#tool-btn-grad)" stroke="#0284c7" stroke-width="1.5"/>
      <path d="M2 2 L82 2" stroke="#7dd3fc" stroke-width="1.5" opacity="0.6"/>
      <!-- 撤回弧形箭头 -->
      <path d="M33 20 L40 14 L40 18 Q49 18 51 25 Q46 22 40 22 L40 26 Z" fill="#ffffff"/>
      <circle cx="76" cy="6" r="6" fill="#1e293b" stroke="#ffffff" stroke-width="1.2"/>
      <path d="M73 6 L79 6 M76 3 L76 9" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round"/>
    </g>

    <!-- 3. 洗牌 🔀 -->
    <g transform="translate(216, 0)">
      <rect x="0" y="3" width="84" height="42" rx="12" fill="#0369a1"/>
      <rect x="0" y="0" width="84" height="40" rx="12" fill="url(#tool-btn-grad)" stroke="#0284c7" stroke-width="1.5"/>
      <path d="M2 2 L82 2" stroke="#7dd3fc" stroke-width="1.5" opacity="0.6"/>
      <!-- 交叉洗牌双箭头 -->
      <path d="M34 16 L44 26 L47 26 L49 24 L37 12 Z" fill="#ffffff"/>
      <path d="M34 26 L42 18 L39 15 L32 22 Z" fill="#ffffff"/>
      <path d="M46 14 L52 14 L52 20 Z" fill="#ffffff"/>
      <circle cx="76" cy="6" r="6" fill="#1e293b" stroke="#ffffff" stroke-width="1.2"/>
      <path d="M73 6 L79 6 M76 3 L76 9" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round"/>
    </g>
  </g>

</svg>
