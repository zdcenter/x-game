<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Outer Card Shadow -->
    <filter id="card-shadow" width="125%" height="125%" x="-12%" y="-10%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <!-- Warm Amber Glow Filter for Lit Cells -->
    <filter id="bulb-glow" width="160%" height="160%" x="-30%" y="-30%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#f59e0b" flood-opacity="0.65"/>
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#d97706" flood-opacity="0.35"/>
    </filter>

    <!-- Subtle Shadow for Unlit Cells -->
    <filter id="unlit-shadow" width="130%" height="130%" x="-15%" y="-15%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <!-- Outer Frame Bevel Gradient -->
    <linearGradient id="frame-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Lit Cell Surface Gradient (Warm Amber Sunrise) -->
    <linearGradient id="lit-surface" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="60%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Unlit Cell Surface Gradient -->
    <linearGradient id="unlit-surface" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Background Pattern Dot Grid -->
    <pattern id="grid-dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1.5" fill="#475569" opacity="0.25"/>
    </pattern>

    <!-- Reusable Lit Lightbulb Graphic (Cell Content) -->
    <g id="lit-cell">
      <!-- Glow Underlay -->
      <rect width="60" height="60" rx="12" fill="url(#lit-surface)" filter="url(#bulb-glow)"/>
      <rect width="58" height="58" x="1" y="1" rx="11" fill="none" stroke="#fef08a" stroke-width="1.5" opacity="0.8"/>
      <!-- Soft Inner Light Halo -->
      <circle cx="30" cy="26" r="16" fill="#fef9c3" opacity="0.45"/>
      <!-- Bulb Icon Silhouette -->
      <path d="M30 14 C23.5 14 18.5 19 18.5 25.5 C18.5 29.8 20.8 33.2 23 36.2 L23 39 C23 39.8 23.7 40.5 24.5 40.5 L35.5 40.5 C36.3 40.5 37 39.8 37 39 L37 36.2 C39.2 33.2 41.5 29.8 41.5 25.5 C41.5 19 36.5 14 30 14 Z" fill="#ffffff" opacity="0.95"/>
      <!-- Glowing Filament -->
      <path d="M26.5 25 Q30 21 33.5 25" fill="none" stroke="#f59e0b" stroke-width="2.2" stroke-linecap="round"/>
      <!-- Screw Base -->
      <path d="M25 41.5 L35 41.5 M26.5 44 L33.5 44" stroke="#78350f" stroke-width="1.8" stroke-linecap="round"/>
    </g>

    <!-- Reusable Unlit Tile Graphic -->
    <g id="unlit-cell">
      <rect width="60" height="60" rx="12" fill="url(#unlit-surface)" filter="url(#unlit-shadow)"/>
      <rect width="58" height="58" x="1" y="1" rx="11" fill="none" stroke="#475569" stroke-width="1.2" opacity="0.5"/>
      <!-- Subtle recessed slot -->
      <rect width="48" height="48" x="6" y="6" rx="8" fill="#0f172a" opacity="0.5"/>
      <!-- Sleepy bulb outline -->
      <path d="M30 17 C25 17 21 21 21 26 C21 29.5 23 32 25 34.5 L25 37.5 C25 38 25.5 38.5 26 38.5 L34 38.5 C34.5 38.5 35 38 35 37.5 L35 34.5 C37 32 39 29.5 39 26 C39 21 35 17 30 17 Z" fill="none" stroke="#64748b" stroke-width="1.6" opacity="0.55"/>
      <path d="M27.5 40.5 L32.5 40.5" stroke="#475569" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
    </g>
  </defs>

  <!-- ═════ Main Card Frame ═════ -->
  <g filter="url(#card-shadow)">
    <!-- Base Rounded Square Card -->
    <rect x="20" y="20" width="460" height="460" rx="32" fill="url(#frame-grad)" stroke="#475569" stroke-width="4"/>
    <!-- Subtle Dot Pattern Inside Frame -->
    <rect x="24" y="24" width="452" height="452" rx="28" fill="url(#grid-dots)"/>
  </g>

  <!-- ═════ Board Recess Well ═════ -->
  <rect x="65" y="65" width="370" height="370" rx="22" fill="#090d16" stroke="rgba(245, 158, 11, 0.25)" stroke-width="2.5"/>

  <!-- ═════ 5x5 Grid Cells (Illuminated Diamond / Star Pattern) ═════ -->
  <!-- Row 0: y = 88 -->
  <g transform="translate(88, 88)"><use href="#unlit-cell"/></g>
  <g transform="translate(154, 88)"><use href="#unlit-cell"/></g>
  <g transform="translate(220, 88)"><use href="#lit-cell"/></g>
  <g transform="translate(286, 88)"><use href="#unlit-cell"/></g>
  <g transform="translate(352, 88)"><use href="#unlit-cell"/></g>

  <!-- Row 1: y = 154 -->
  <g transform="translate(88, 154)"><use href="#unlit-cell"/></g>
  <g transform="translate(154, 154)"><use href="#lit-cell"/></g>
  <g transform="translate(220, 154)"><use href="#lit-cell"/></g>
  <g transform="translate(286, 154)"><use href="#lit-cell"/></g>
  <g transform="translate(352, 154)"><use href="#unlit-cell"/></g>

  <!-- Row 2: y = 220 (Center Row) -->
  <g transform="translate(88, 220)"><use href="#lit-cell"/></g>
  <g transform="translate(154, 220)"><use href="#lit-cell"/></g>
  <g transform="translate(220, 220)"><use href="#lit-cell"/></g>
  <g transform="translate(286, 220)"><use href="#lit-cell"/></g>
  <g transform="translate(352, 220)"><use href="#lit-cell"/></g>

  <!-- Row 3: y = 286 -->
  <g transform="translate(88, 286)"><use href="#unlit-cell"/></g>
  <g transform="translate(154, 286)"><use href="#lit-cell"/></g>
  <g transform="translate(220, 286)"><use href="#lit-cell"/></g>
  <g transform="translate(286, 286)"><use href="#lit-cell"/></g>
  <g transform="translate(352, 286)"><use href="#unlit-cell"/></g>

  <!-- Row 4: y = 352 -->
  <g transform="translate(88, 352)"><use href="#unlit-cell"/></g>
  <g transform="translate(154, 352)"><use href="#unlit-cell"/></g>
  <g transform="translate(220, 352)"><use href="#lit-cell"/></g>
  <g transform="translate(286, 352)"><use href="#unlit-cell"/></g>
  <g transform="translate(352, 352)"><use href="#unlit-cell"/></g>
</svg>