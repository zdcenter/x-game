<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
  <defs>
    <filter id="shadow-base" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="15" stdDeviation="15" flood-color="#000" flood-opacity="0.6"/>
    </filter>
    <filter id="shadow-tile" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <filter id="glow-purple" x="-35%" y="-35%" width="170%" height="170%">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#a855f7" flood-opacity="0.9"/>
    </filter>
    <filter id="glow-gold" x="-35%" y="-35%" width="170%" height="170%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#f59e0b" flood-opacity="0.85"/>
    </filter>
    <filter id="glow-seal" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#dc2626" flood-opacity="0.55"/>
    </filter>

    <pattern id="bgpat" width="56" height="56" patternUnits="userSpaceOnUse" patternTransform="translate(26,26)">
      <rect width="50" height="50" rx="8" fill="#0f172a" opacity="0.6"/>
    </pattern>

    <linearGradient id="g-tile" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#0d1f38"/>
    </linearGradient>
    <linearGradient id="g-active" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#3b0764"/>
    </linearGradient>
    <linearGradient id="g-scroll" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7c2d12"/>
      <stop offset="100%" stop-color="#431407"/>
    </linearGradient>
    <linearGradient id="g-answer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#431407"/>
    </linearGradient>
    <linearGradient id="g-chip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Base card -->
  <g filter="url(#shadow-base)">
    <rect x="20" y="20" width="460" height="460" rx="30" fill="#1e293b" stroke="#334155" stroke-width="4"/>
    <rect x="26" y="26" width="448" height="448" fill="url(#bgpat)" opacity="0.25"/>
  </g>

  <!-- Bamboo scroll banner -->
  <ellipse cx="55"  cy="83" rx="13" ry="28" fill="#5c2d0a" stroke="#92400e" stroke-width="1.5"/>
  <ellipse cx="55"  cy="83" rx="8"  ry="20" fill="#7c3d12"/>
  <ellipse cx="445" cy="83" rx="13" ry="28" fill="#5c2d0a" stroke="#92400e" stroke-width="1.5"/>
  <ellipse cx="445" cy="83" rx="8"  ry="20" fill="#7c3d12"/>
  <rect x="55" y="55" width="390" height="56" fill="url(#g-scroll)" stroke="#92400e" stroke-width="1.5"/>
  <rect x="55" y="55" width="390" height="10" fill="rgba(255,255,255,0.07)"/>
  <text x="250" y="92" font-family="serif" font-size="22" font-weight="bold"
        fill="#fde68a" text-anchor="middle" letter-spacing="14" opacity="0.95">&#x6210; &#x8BED; &#x76CA; &#x667A;</text>

  <!-- 4 Character Tiles  width=90 gap=14 start-x=49 y=140 h=118 -->
  <!-- Tile 1: &#x4E00; (一) -->
  <g filter="url(#shadow-tile)">
    <rect x="49" y="140" width="90" height="118" rx="14" fill="url(#g-tile)" stroke="#2d4a73" stroke-width="2"/>
    <rect x="52" y="143" width="84" height="8" rx="6" fill="rgba(255,255,255,0.06)"/>
  </g>
  <text x="94" y="220" font-family="serif" font-size="62" font-weight="bold"
        fill="#e2e8f0" text-anchor="middle">&#x4E00;</text>

  <!-- Tile 2: &#x6B65; (步) -->
  <g filter="url(#shadow-tile)">
    <rect x="153" y="140" width="90" height="118" rx="14" fill="url(#g-tile)" stroke="#2d4a73" stroke-width="2"/>
    <rect x="156" y="143" width="84" height="8" rx="6" fill="rgba(255,255,255,0.06)"/>
  </g>
  <text x="198" y="220" font-family="serif" font-size="62" font-weight="bold"
        fill="#e2e8f0" text-anchor="middle">&#x6B65;</text>

  <!-- Tile 3: BLANK (active purple) -->
  <g filter="url(#glow-purple)">
    <rect x="253" y="128" width="96" height="132" rx="16" fill="url(#g-active)" stroke="#a855f7" stroke-width="2.5"/>
    <rect x="256" y="131" width="90" height="10" rx="7" fill="rgba(255,255,255,0.08)"/>
  </g>
  <!-- Dashed underline = blank slot -->
  <line x1="270" y1="215" x2="332" y2="215"
        stroke="#c084fc" stroke-width="3.5" stroke-dasharray="9,5" stroke-linecap="round"/>
  <!-- Small cursor bar -->
  <rect x="295" y="188" width="4" height="36" rx="2" fill="#e9d5ff" opacity="0.7"/>

  <!-- Tile 4: &#x5929; (天) -->
  <g filter="url(#shadow-tile)">
    <rect x="361" y="140" width="90" height="118" rx="14" fill="url(#g-tile)" stroke="#2d4a73" stroke-width="2"/>
    <rect x="364" y="143" width="84" height="8" rx="6" fill="rgba(255,255,255,0.06)"/>
  </g>
  <text x="406" y="220" font-family="serif" font-size="62" font-weight="bold"
        fill="#e2e8f0" text-anchor="middle">&#x5929;</text>

  <!-- Connector dots -->
  <circle cx="147" cy="199" r="4" fill="#3d5a80" opacity="0.8"/>
  <circle cx="251" cy="199" r="4" fill="#3d5a80" opacity="0.8"/>
  <circle cx="355" cy="199" r="4" fill="#3d5a80" opacity="0.8"/>

  <!-- Keyboard chips  w=64 h=50 gap=9 total=356 start-x=72 y=285 -->
  <!-- Chip 1: &#x767B; (登) answer = gold -->
  <g filter="url(#glow-gold)">
    <rect x="72"  y="285" width="64" height="50" rx="10" fill="url(#g-answer)" stroke="#f59e0b" stroke-width="2.5"/>
  </g>
  <text x="104" y="321" font-family="serif" font-size="30" font-weight="bold"
        fill="#fbbf24" text-anchor="middle">&#x767B;</text>

  <!-- Chip 2: &#x4E34; (临) -->
  <rect x="145" y="285" width="64" height="50" rx="10" fill="url(#g-chip)" stroke="#3d5468" stroke-width="1.5"/>
  <text x="177" y="321" font-family="serif" font-size="30" fill="#64748b" text-anchor="middle">&#x4E34;</text>

  <!-- Chip 3: &#x8DC3; (跃) -->
  <rect x="218" y="285" width="64" height="50" rx="10" fill="url(#g-chip)" stroke="#3d5468" stroke-width="1.5"/>
  <text x="250" y="321" font-family="serif" font-size="30" fill="#64748b" text-anchor="middle">&#x8DC3;</text>

  <!-- Chip 4: &#x98DE; (飞) -->
  <rect x="291" y="285" width="64" height="50" rx="10" fill="url(#g-chip)" stroke="#3d5468" stroke-width="1.5"/>
  <text x="323" y="321" font-family="serif" font-size="30" fill="#64748b" text-anchor="middle">&#x98DE;</text>

  <!-- Chip 5: &#x4E91; (云) -->
  <rect x="364" y="285" width="64" height="50" rx="10" fill="url(#g-chip)" stroke="#3d5468" stroke-width="1.5"/>
  <text x="396" y="321" font-family="serif" font-size="30" fill="#64748b" text-anchor="middle">&#x4E91;</text>

  <!-- Score dots: first to 3 wins  (2 scored, 1 current, 2 empty) -->
  <circle cx="175" cy="378" r="12" fill="#7c3aed" opacity="0.95"/>
  <circle cx="205" cy="378" r="12" fill="#7c3aed" opacity="0.95"/>
  <circle cx="235" cy="378" r="12" fill="#a855f7" opacity="0.4" stroke="#a855f7" stroke-width="2"/>
  <circle cx="265" cy="378" r="12" fill="#1e293b" stroke="#475569" stroke-width="2"/>
  <circle cx="295" cy="378" r="12" fill="#1e293b" stroke="#475569" stroke-width="2"/>
  <text x="320" y="383" font-family="sans-serif" font-size="12" font-weight="bold"
        fill="#64748b" text-anchor="start">&#x5148;&#x5F977;3&#x5206;</text>

  <!-- Trophy shape (SVG path, no emoji) -->
  <g transform="translate(48, 358)" opacity="0.45">
    <path d="M17 4H7C5.9 4 5 4.9 5 6v6c0 3.9 3.2 7 7 7s7-3.1 7-7V6c0-1.1-.9-2-2-2z" fill="#a855f7"/>
    <path d="M5 8H2v4c0 1.7 1.3 3 3 3h0.2C5.1 14.4 5 13.7 5 13V8z" fill="#7c3aed"/>
    <path d="M22 8h-3v5c0 .7-.1 1.4-.2 2H19c1.7 0 3-1.3 3-3V8z" fill="#7c3aed"/>
    <rect x="9" y="19" width="6" height="2" rx="1" fill="#a855f7"/>
    <rect x="7" y="21" width="10" height="2" rx="1" fill="#7c3aed"/>
  </g>

  <!-- Red seal stamp (印章) bottom-right rotated -->
  <g filter="url(#glow-seal)" transform="rotate(-11, 418, 425)">
    <rect x="388" y="395" width="60" height="60" rx="9" fill="#dc2626" opacity="0.88"/>
    <rect x="392" y="399" width="52" height="52" rx="6" fill="none" stroke="#fca5a5" stroke-width="1.5" opacity="0.55"/>
    <text x="418" y="424" font-family="serif" font-size="15" font-weight="bold"
          fill="#fef2f2" text-anchor="middle">&#x6210;</text>
    <text x="418" y="442" font-family="serif" font-size="15" font-weight="bold"
          fill="#fef2f2" text-anchor="middle">&#x8BED;</text>
  </g>

  <!-- Subtle accent lines -->
  <line x1="30" y1="460" x2="80" y2="430" stroke="#7c3aed" stroke-width="1.5" opacity="0.12" stroke-linecap="round"/>
  <line x1="40" y1="470" x2="100" y2="440" stroke="#7c3aed" stroke-width="1" opacity="0.08" stroke-linecap="round"/>
</svg>
