<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
  <defs>
    <!-- Background Gradient: Deep Imperial Burgundy & Night Lacquer -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d0b16"/>
      <stop offset="50%" stop-color="#19070e"/>
      <stop offset="100%" stop-color="#0b0306"/>
    </linearGradient>

    <!-- Dragon Scales & Body Gradient -->
    <linearGradient id="dragonBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="40%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>

    <!-- Dragon Belly / Gold Underbelly Gradient -->
    <linearGradient id="dragonBelly" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>

    <!-- Gold Foil Gradient for Frames & Coins -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <!-- Ivory / Jade Tile Gradient -->
    <linearGradient id="tileGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="70%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>

    <!-- Vermilion Red Seal Gradient -->
    <linearGradient id="sealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>

    <!-- Fiery Pearl Radial Gradient -->
    <radialGradient id="pearlGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#fef08a"/>
      <stop offset="55%" stop-color="#f97316"/>
      <stop offset="85%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </radialGradient>

    <!-- Drop Shadows -->
    <filter id="shadowCard" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.65"/>
    </filter>

    <filter id="shadowTile" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.55"/>
    </filter>

    <filter id="glowGold" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#fbbf24" flood-opacity="0.75"/>
    </filter>

    <filter id="glowPearl" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="15" flood-color="#f97316" flood-opacity="0.9"/>
    </filter>

    <!-- Subtle Background Diamond Lattice Pattern -->
    <pattern id="latticePat" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M20 0 L40 20 L20 40 L0 20 Z" fill="none" stroke="#f59e0b" stroke-width="0.7" opacity="0.12"/>
      <circle cx="20" cy="20" r="1.5" fill="#f59e0b" opacity="0.15"/>
    </pattern>
  </defs>

  <!-- 1. Base Container Card with Gold Filigree Rim -->
  <g filter="url(#shadowCard)">
    <rect x="20" y="20" width="460" height="460" rx="36" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="4"/>
    <rect x="28" y="28" width="444" height="444" rx="28" fill="url(#latticePat)"/>
  </g>

  <!-- 2. Traditional Chinese Corner Borders (回纹 / 祥云角) -->
  <g stroke="url(#goldGrad)" stroke-width="2.5" fill="none" opacity="0.6">
    <!-- Top-Left Corner -->
    <path d="M42 66 L42 42 L66 42 M50 74 L50 50 L74 50"/>
    <!-- Top-Right Corner -->
    <path d="M458 66 L458 42 L434 42 M450 74 L450 50 L426 50"/>
    <!-- Bottom-Left Corner -->
    <path d="M42 434 L42 458 L66 458 M50 426 L50 450 L74 450"/>
    <!-- Bottom-Right Corner -->
    <path d="M458 434 L458 458 L434 458 M450 426 L450 450 L426 450"/>
  </g>

  <!-- 3. Auspicious Dragon Body (Coiling S-Curve Chain) -->
  <g>
    <!-- Dragon Body Silhouette Outer Shadow -->
    <path d="M110 390 C80 340 75 250 145 200 C215 150 310 180 365 140 C410 105 405 60 360 48"
          fill="none" stroke="#042f2e" stroke-width="44" stroke-linecap="round" opacity="0.7"/>

    <!-- Dragon Body Main Spine (Emerald Jade) -->
    <path d="M110 390 C80 340 75 250 145 200 C215 150 310 180 365 140 C410 105 405 60 360 48"
          fill="none" stroke="url(#dragonBody)" stroke-width="36" stroke-linecap="round"/>

    <!-- Dragon Underbelly Scales (Golden Ridges) -->
    <path d="M118 396 C88 346 83 256 153 206 C223 156 318 186 373 146 C415 112 408 68 368 54"
          fill="none" stroke="url(#dragonBelly)" stroke-width="12" stroke-linecap="round" opacity="0.95"/>

    <!-- Dorsal Fin Spikes (Flame / Wave Motif) -->
    <g fill="#f59e0b" opacity="0.85">
      <path d="M102 330 L90 316 L105 318 Z"/>
      <path d="M100 280 L88 266 L104 270 Z"/>
      <path d="M115 235 L106 218 L122 225 Z"/>
      <path d="M165 185 L165 166 L178 180 Z"/>
      <path d="M225 165 L232 148 L240 166 Z"/>
      <path d="M285 168 L296 150 L302 168 Z"/>
      <path d="M340 152 L356 136 L356 155 Z"/>
    </g>

    <!-- Dragon Claws (Auspicious Talons) -->
    <!-- Left Talon reaching up -->
    <g stroke="url(#goldGrad)" stroke-width="3" fill="#047857" stroke-linejoin="round">
      <path d="M85 240 Q65 220 50 225 M85 240 Q68 232 52 240 M85 240 Q72 248 58 255"/>
      <circle cx="50" cy="225" r="3" fill="#fef08a"/>
      <circle cx="52" cy="240" r="3" fill="#fef08a"/>
      <circle cx="58" cy="255" r="3" fill="#fef08a"/>
    </g>
    <!-- Right Talon guarding the Pearl -->
    <g stroke="url(#goldGrad)" stroke-width="3.5" fill="#047857" stroke-linejoin="round">
      <path d="M370 170 Q395 185 415 180 M370 170 Q398 198 412 205 M370 170 Q385 210 398 220"/>
      <circle cx="415" cy="180" r="3.5" fill="#fef08a"/>
      <circle cx="412" cy="205" r="3.5" fill="#fef08a"/>
      <circle cx="398" cy="220" r="3.5" fill="#fef08a"/>
    </g>
  </g>

  <!-- 4. Dragon Head (威武祥龙·栩栩如生) -->
  <g transform="translate(320, 30)">
    <!-- Dragon Mane (Mane / Hair) -->
    <path d="M60 40 Q95 20 115 5 Q95 45 105 70 Q75 60 60 75" fill="#f59e0b" opacity="0.9"/>
    <path d="M45 45 Q80 35 95 20 Q80 55 90 75" fill="#ef4444" opacity="0.8"/>

    <!-- Dragon Horns (Antlers) -->
    <path d="M42 28 Q48 5 62 -2 Q52 14 55 24 M52 8 Q65 4 72 -5 Q64 10 56 16"
          stroke="url(#goldGrad)" stroke-width="4.5" fill="none" stroke-linecap="round"/>

    <!-- Dragon Snout & Head Base -->
    <path d="M15 48 C15 32 35 25 50 32 C65 38 70 55 58 68 C45 78 20 72 15 48 Z"
          fill="url(#dragonBody)" stroke="url(#goldGrad)" stroke-width="2"/>

    <!-- Dragon Muzzle / Whiskers Pad -->
    <path d="M12 48 Q2 42 -8 50 Q-2 62 14 60 Z" fill="#047857" stroke="url(#goldGrad)" stroke-width="1.5"/>

    <!-- Dragon Tooth -->
    <polygon points="4,58 10,65 14,58" fill="#ffffff"/>

    <!-- Dragon Eye (Glowing Amber/Ruby) -->
    <ellipse cx="34" cy="40" rx="6" ry="7" fill="#fef08a" stroke="#b45309" stroke-width="1.5"/>
    <ellipse cx="33" cy="40" rx="3" ry="4" fill="#991b1b"/>
    <circle cx="35" cy="38" r="1.5" fill="#ffffff"/>

    <!-- Dragon Whiskers (Long Flowing Mustache) -->
    <path d="M-4 50 Q-45 35 -65 60 Q-40 52 0 54" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round"/>
    <path d="M-2 56 Q-30 65 -50 95 Q-28 75 4 60" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- 5. Fiery Dragon Pearl (炽热祥瑞龙珠) -->
  <g filter="url(#glowPearl)" transform="translate(420, 205)">
    <circle cx="0" cy="0" r="26" fill="url(#pearlGlow)"/>
    <circle cx="-6" cy="-6" r="6" fill="#ffffff" opacity="0.75"/>
    <!-- Fire Flares around the Pearl -->
    <path d="M0 -30 Q-6 -42 0 -50 Q6 -42 0 -30" fill="#f59e0b"/>
    <path d="M26 -14 Q38 -20 48 -14 Q38 -8 26 -14" fill="#f59e0b"/>
    <path d="M20 20 Q32 30 35 42 Q22 34 20 20" fill="#ef4444"/>
    <path d="M-22 18 Q-36 28 -42 20 Q-30 14 -22 18" fill="#f59e0b"/>
  </g>

  <!-- 6. Traditional Chinese Auspicious Clouds (祥云环绕) -->
  <g fill="none" stroke="url(#goldGrad)" stroke-width="2.2" opacity="0.55">
    <!-- Cloud Left -->
    <path d="M55 385 C40 385 30 375 35 362 C40 350 55 352 62 355 C65 342 82 340 90 352 C98 345 112 350 110 365 C122 368 125 385 110 385 Z"/>
    <!-- Cloud Bottom Right -->
    <path d="M370 435 C355 435 348 425 352 415 C358 402 372 405 380 408 C385 395 402 395 410 405 C420 398 435 405 432 418 C445 422 445 435 432 435 Z"/>
  </g>

  <!-- 7. The Core Feature: Four Linked Idiom Jade Tiles 【成】➔【语】➔【接】➔【龙】 -->
  <!-- Connector Ribbon / Auspicious Golden Thread connecting the tiles -->
  <path d="M78 285 C145 270 215 285 250 280 C290 275 360 285 420 280"
        fill="none" stroke="url(#goldGrad)" stroke-width="5" stroke-dasharray="10 5" filter="url(#glowGold)"/>

  <!-- Tile 1: 成 (Chéng) -->
  <g filter="url(#shadowTile)" transform="translate(48, 235)">
    <!-- Tile Base -->
    <rect x="0" y="0" width="86" height="96" rx="16" fill="url(#tileGrad)" stroke="url(#goldGrad)" stroke-width="3"/>
    <!-- Inner Border Line -->
    <rect x="5" y="5" width="76" height="86" rx="12" fill="none" stroke="#d97706" stroke-width="1.2" opacity="0.6"/>
    <!-- Character "成" -->
    <text x="43" y="65" font-family="'PingFang SC', 'Microsoft YaHei UI', 'Noto Serif SC', 'SimSun', serif"
          font-size="46" font-weight="900" fill="#991b1b" text-anchor="middle"
          style="text-shadow: 1px 1px 0 #fef08a;">成</text>
    <text x="43" y="84" font-family="sans-serif" font-size="11" font-weight="bold" fill="#b45309" text-anchor="middle">chéng</text>
  </g>

  <!-- Linker Bead 1-2 -->
  <g transform="translate(142, 280)">
    <circle cx="0" cy="0" r="8" fill="url(#goldGrad)" stroke="#78350f" stroke-width="1.5"/>
    <text x="0" y="3.5" font-family="sans-serif" font-size="10" font-weight="black" fill="#78350f" text-anchor="middle">➔</text>
  </g>

  <!-- Tile 2: 语 (Yǔ) -->
  <g filter="url(#shadowTile)" transform="translate(156, 235)">
    <rect x="0" y="0" width="86" height="96" rx="16" fill="url(#tileGrad)" stroke="url(#goldGrad)" stroke-width="3"/>
    <rect x="5" y="5" width="76" height="86" rx="12" fill="none" stroke="#d97706" stroke-width="1.2" opacity="0.6"/>
    <text x="43" y="65" font-family="'PingFang SC', 'Microsoft YaHei UI', 'Noto Serif SC', 'SimSun', serif"
          font-size="46" font-weight="900" fill="#991b1b" text-anchor="middle"
          style="text-shadow: 1px 1px 0 #fef08a;">语</text>
    <text x="43" y="84" font-family="sans-serif" font-size="11" font-weight="bold" fill="#b45309" text-anchor="middle">yǔ</text>
  </g>

  <!-- Linker Bead 2-3 -->
  <g transform="translate(250, 280)">
    <circle cx="0" cy="0" r="8" fill="url(#goldGrad)" stroke="#78350f" stroke-width="1.5"/>
    <text x="0" y="3.5" font-family="sans-serif" font-size="10" font-weight="black" fill="#78350f" text-anchor="middle">➔</text>
  </g>

  <!-- Tile 3: 接 (Jiē) -->
  <g filter="url(#shadowTile)" transform="translate(264, 235)">
    <rect x="0" y="0" width="86" height="96" rx="16" fill="url(#tileGrad)" stroke="url(#goldGrad)" stroke-width="3"/>
    <rect x="5" y="5" width="76" height="86" rx="12" fill="none" stroke="#d97706" stroke-width="1.2" opacity="0.6"/>
    <text x="43" y="65" font-family="'PingFang SC', 'Microsoft YaHei UI', 'Noto Serif SC', 'SimSun', serif"
          font-size="46" font-weight="900" fill="#047857" text-anchor="middle"
          style="text-shadow: 1px 1px 0 #fef08a;">接</text>
    <text x="43" y="84" font-family="sans-serif" font-size="11" font-weight="bold" fill="#047857" text-anchor="middle">jiē</text>
  </g>

  <!-- Linker Bead 3-4 (Active Gold Pulse) -->
  <g transform="translate(358, 280)" filter="url(#glowGold)">
    <circle cx="0" cy="0" r="9" fill="url(#goldGrad)" stroke="#78350f" stroke-width="1.5"/>
    <text x="0" y="4" font-family="sans-serif" font-size="11" font-weight="black" fill="#78350f" text-anchor="middle">➔</text>
  </g>

  <!-- Tile 4: 龙 (Lóng) - Hero Highlight Target Tile -->
  <g filter="url(#shadowTile)" transform="translate(372, 230)">
    <!-- Golden Halo Ring -->
    <rect x="-3" y="-3" width="92" height="102" rx="18" fill="none" stroke="url(#goldGrad)" stroke-width="3" filter="url(#glowGold)"/>
    <rect x="0" y="0" width="86" height="96" rx="16" fill="url(#tileGrad)" stroke="#f59e0b" stroke-width="3"/>
    <rect x="5" y="5" width="76" height="86" rx="12" fill="none" stroke="#d97706" stroke-width="1.2" opacity="0.6"/>
    <text x="43" y="65" font-family="'PingFang SC', 'Microsoft YaHei UI', 'Noto Serif SC', 'SimSun', serif"
          font-size="48" font-weight="900" fill="#b91c1c" text-anchor="middle"
          style="text-shadow: 1px 1px 0 #fde047;">龙</text>
    <text x="43" y="84" font-family="sans-serif" font-size="11" font-weight="bold" fill="#b45309" text-anchor="middle">lóng</text>
  </g>

  <!-- 8. Traditional Plaque Header (金字红底牌匾: 真·成语接龙) -->
  <g filter="url(#shadowTile)" transform="translate(130, 48)">
    <rect x="0" y="0" width="240" height="48" rx="10" fill="url(#sealGrad)" stroke="url(#goldGrad)" stroke-width="2.5"/>
    <rect x="4" y="4" width="232" height="40" rx="8" fill="none" stroke="#fef08a" stroke-width="1" opacity="0.6"/>
    <circle cx="14" cy="24" r="3.5" fill="#fef08a"/>
    <circle cx="226" cy="24" r="3.5" fill="#fef08a"/>
    <text x="120" y="33" font-family="'PingFang SC', 'Microsoft YaHei UI', 'Noto Serif SC', 'SimSun', serif"
          font-size="22" font-weight="900" letter-spacing="6" fill="#fef08a" text-anchor="middle"
          style="text-shadow: 0 2px 4px rgba(0,0,0,0.6);">真·成语接龙</text>
  </g>

  <!-- 9. Auspicious Cinnabar Seal (朱砂闲章: 妙语连珠) -->
  <g filter="url(#shadowTile)" transform="translate(68, 375)">
    <rect x="0" y="0" width="48" height="48" rx="8" fill="#b91c1c" stroke="#fca5a5" stroke-width="1.5" opacity="0.9"/>
    <rect x="3" y="3" width="42" height="42" rx="6" fill="none" stroke="#fef2f2" stroke-width="1" opacity="0.6"/>
    <text x="14" y="20" font-family="'PingFang SC', serif" font-size="12" font-weight="bold" fill="#fef2f2">妙</text>
    <text x="32" y="20" font-family="'PingFang SC', serif" font-size="12" font-weight="bold" fill="#fef2f2">语</text>
    <text x="14" y="38" font-family="'PingFang SC', serif" font-size="12" font-weight="bold" fill="#fef2f2">连</text>
    <text x="32" y="38" font-family="'PingFang SC', serif" font-size="12" font-weight="bold" fill="#fef2f2">珠</text>
  </g>

  <!-- 10. Subtle Golden Dust / Sparkles -->
  <g fill="#fef08a" opacity="0.8">
    <circle cx="160" cy="130" r="2"/>
    <circle cx="270" cy="115" r="2.5"/>
    <circle cx="330" cy="210" r="1.5"/>
    <circle cx="120" cy="220" r="2"/>
    <circle cx="440" cy="330" r="2.5"/>
    <circle cx="220" cy="380" r="1.5"/>
  </g>
</svg>