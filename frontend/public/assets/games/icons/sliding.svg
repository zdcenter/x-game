<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
  <defs>
    <!-- Background Tray Shadow -->
    <filter id="board-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="15" stdDeviation="15" flood-color="#000" flood-opacity="0.6"/>
    </filter>
    <filter id="tile-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <pattern id="grid8" width="56" height="56" patternUnits="userSpaceOnUse" patternTransform="translate(26, 26)">
      <rect width="50" height="50" rx="8" fill="#0f172a" opacity="0.6" />
    </pattern>

    <!-- Gradients -->
    <linearGradient id="tile-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    
    <!-- Highlight Tile Gradient (Pink/Purple) -->
    <linearGradient id="highlight-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#db2777" />
    </linearGradient>

  </defs>

  <!-- Base Tray -->
  <g filter="url(#board-shadow)">
    <rect x="20" y="20" width="460" height="460" rx="30" fill="#1e293b" stroke="#334155" stroke-width="5" />
    <rect x="26" y="26" width="448" height="448" fill="url(#grid8)" opacity="0.3" />
  </g>

  <!-- Board Container -->
  <rect x="75" y="75" width="350" height="350" rx="16" fill="rgba(15, 23, 42, 0.7)" stroke="rgba(51, 65, 85, 0.5)" stroke-width="3" />
  <g transform="translate(85, 85)" filter="url(#tile-shadow)">
      <!-- 3D Base (Shadow Edge) -->
      <rect x="0" y="0" width="75" height="75" rx="12" fill="#0f172a" />
      
      <!-- 3D Top Surface -->
      <rect x="0" y="0" width="72" height="70" rx="10" fill="url(#tile-grad)" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" />
      
      <!-- Number -->
      <text x="36" y="45" font-family="sans-serif" font-weight="900" font-size="28" fill="#f1f5f9" text-anchor="middle">1</text>
    </g>
  <g transform="translate(170, 85)" filter="url(#tile-shadow)">
      <!-- 3D Base (Shadow Edge) -->
      <rect x="0" y="0" width="75" height="75" rx="12" fill="#0f172a" />
      
