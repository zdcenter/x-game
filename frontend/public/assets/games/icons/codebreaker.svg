<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
  <defs>
    <!-- Background Tray Shadow -->
    <filter id="board-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="15" stdDeviation="15" flood-color="#000" flood-opacity="0.6"/>
    </filter>
    <filter id="card-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#10b981" flood-opacity="0.8"/>
    </filter>
    <filter id="glow-red" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#ef4444" flood-opacity="0.6"/>
    </filter>
    <pattern id="grid8" width="56" height="56" patternUnits="userSpaceOnUse" patternTransform="translate(26, 26)">
      <rect width="50" height="50" rx="8" fill="#0f172a" opacity="0.6" />
    </pattern>
    <linearGradient id="metal-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="50%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="screen-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
  </defs>

  <!-- Base Tray -->
  <g filter="url(#board-shadow)">
    <rect x="20" y="20" width="460" height="460" rx="30" fill="#1e293b" stroke="#334155" stroke-width="5" />
    <rect x="26" y="26" width="448" height="448" fill="url(#grid8)" opacity="0.3" />
  </g>

  <!-- Main Device / Safe Lock -->
  <g transform="translate(50, 50)">
    <!-- Device Body -->
    <rect x="0" y="0" width="400" height="400" rx="20" fill="url(#metal-grad)" filter="url(#card-shadow)" />
    
    <!-- Inner Dark Area -->
    <rect x="20" y="20" width="360" height="360" rx="16" fill="#0f172a" stroke="#1e293b" stroke-width="6" />

    <!-- Top Screen (Decoded Result) -->
    <rect x="50" y="60" width="300" height="100" rx="12" fill="url(#screen-grad)" stroke="#047857" stroke-width="4" filter="url(#glow)"/>
    
    <!-- Screen Glare -->
    <path d="M 52 62 L 348 62 Q 350 110 52 110 Z" fill="rgba(255,255,255,0.05)" />

    <!-- Screen Text 1A2B -->
    <text x="200" y="130" font-family="monospace" font-size="70" font-weight="900" fill="#34d399" text-anchor="middle" letter-spacing="4" style="text-shadow: 0 0 10px #10b981;">1A 2B</text>

    <!-- Code Input Slots -->
    <g transform="translate(60, 200)">
      <!-- Slot 1 -->
      <rect x="0" y="0" width="55" height="75" rx="8" fill="#1e293b" stroke="#334155" stroke-width="3" filter="url(#card-shadow)" />
      <text x="27.5" y="55" font-family="monospace" font-size="50" font-weight="900" fill="#f8fafc" text-anchor="middle">7</text>
      <circle cx="27.5" cy="88" r="6" fill="#10b981" filter="url(#glow)"/>

      <!-- Slot 2 -->
      <rect x="75" y="0" width="55" height="75" rx="8" fill="#1e293b" stroke="#334155" stroke-width="3" filter="url(#card-shadow)" />
      <text x="102.5" y="55" font-family="monospace" font-size="50" font-weight="900" fill="#f8fafc" text-anchor="middle">4</text>
      <circle cx="102.5" cy="88" r="6" fill="#fbbf24" />

      <!-- Slot 3 -->
      <rect x="150" y="0" width="55" height="75" rx="8" fill="#1e293b" stroke="#334155" stroke-width="3" filter="url(#card-shadow)" />
      <text x="177.5" y="55" font-family="monospace" font-size="50" font-weight="900" fill="#f8fafc" text-anchor="middle">8</text>
      <circle cx="177.5" cy="88" r="6" fill="#fbbf24" />

      <!-- Slot 4 -->
      <rect x="225" y="0" width="55" height="75" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="3" filter="url(#card-shadow)" />
      <text x="252.5" y="55" font-family="monospace" font-size="50" font-weight="900" fill="#ef4444" text-anchor="middle">5</text>
      <circle cx="252.5" cy="88" r="6" fill="#ef4444" filter="url(#glow-red)" />
    </g>

    <!-- Fingerprint / Dial element -->
    <circle cx="200" cy="330" r="30" fill="transparent" stroke="#475569" stroke-width="4" stroke-dasharray="8 4"/>
    <circle cx="200" cy="330" r="20" fill="transparent" stroke="#34d399" stroke-width="2" />
    <circle cx="200" cy="330" r="8" fill="#10b981" filter="url(#glow)"/>
    <path d="M 170 330 L 150 330 M 230 330 L 250 330 M 200 300 L 200 280 M 200 360 L 200 380" stroke="#475569" stroke-width="3" stroke-linecap="round" />
  </g>
</svg>