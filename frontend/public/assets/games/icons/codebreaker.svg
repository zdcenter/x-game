<svg xmlns="http://www.w3.org/2000/svg" width="110" height="110" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="badge-a" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="badge-b" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.8"/>
    </filter>
    <filter id="pin-shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#000" flood-opacity="0.7"/>
    </filter>
    <radialGradient id="pin-shine" cx="40%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    
    <g id="pin">
      <circle cx="0" cy="0" r="8" fill="currentColor" filter="url(#pin-shadow)" />
      <circle cx="0" cy="0" r="8" fill="url(#pin-shine)" />
    </g>
  </defs>

  <g filter="url(#shadow)">
    <!-- Device Base 3D Shadow/Bevel -->
    <rect x="5" y="15" width="90" height="75" rx="16" fill="#000000" />
    <!-- Device Base Top -->
    <rect x="5" y="10" width="90" height="75" rx="16" fill="url(#bg)" stroke="#334155" stroke-width="1.5" />
    <!-- Device Screen cavity -->
    <rect x="12" y="20" width="76" height="30" rx="8" fill="#0f172a" stroke="#000000" stroke-width="2" />
    <!-- Screen Inner glow -->
    <rect x="13" y="21" width="74" height="28" rx="7" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.05" />

    <!-- Four Color Pegs -->
    <g color="#ef4444"><use href="#pin" x="24" y="35" /></g>
    <g color="#3b82f6"><use href="#pin" x="41.3" y="35" /></g>
    <g color="#8b5cf6"><use href="#pin" x="58.6" y="35" /></g>
    <g color="#ec4899"><use href="#pin" x="76" y="35" /></g>

    <!-- 1A Badge 3D -->
    <g transform="translate(14, 55)">
      <rect x="0" y="3" width="34" height="20" rx="6" fill="#064e3b" />
      <rect x="0" y="0" width="34" height="20" rx="6" fill="url(#badge-a)" stroke="#6ee7b7" stroke-width="0.5" />
      <text x="17" y="14" font-family="Arial, sans-serif" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle" filter="drop-shadow(0px 1px 1px rgba(0,0,0,0.5))">1 A</text>
    </g>

    <!-- 2B Badge 3D -->
    <g transform="translate(52, 55)">
      <rect x="0" y="3" width="34" height="20" rx="6" fill="#78350f" />
      <rect x="0" y="0" width="34" height="20" rx="6" fill="url(#badge-b)" stroke="#fcd34d" stroke-width="0.5" />
      <text x="17" y="14" font-family="Arial, sans-serif" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle" filter="drop-shadow(0px 1px 1px rgba(0,0,0,0.5))">2 B</text>
    </g>
  </g>
</svg>
