<svg xmlns="http://www.w3.org/2000/svg" width="110" height="110" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="badge-a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="badge-b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Device Base -->
  <rect x="8" y="15" width="84" height="70" rx="14" fill="url(#bg)" stroke="#334155" stroke-width="2" filter="url(#shadow)" />
  
  <!-- Four Color Pegs -->
  <circle cx="26" cy="35" r="7" fill="#ef4444" filter="url(#shadow)" />
  <circle cx="42" cy="35" r="7" fill="#3b82f6" filter="url(#shadow)" />
  <circle cx="58" cy="35" r="7" fill="#8b5cf6" filter="url(#shadow)" />
  <circle cx="74" cy="35" r="7" fill="#ec4899" filter="url(#shadow)" />

  <!-- 1A Badge -->
  <rect x="18" y="55" width="30" height="20" rx="6" fill="url(#badge-a)" filter="url(#shadow)" />
  <text x="33" y="70" font-family="Arial, sans-serif" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle">1 A</text>

  <!-- 2B Badge -->
  <rect x="52" y="55" width="30" height="20" rx="6" fill="url(#badge-b)" filter="url(#shadow)" />
  <text x="67" y="70" font-family="Arial, sans-serif" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle">2 B</text>
</svg>
