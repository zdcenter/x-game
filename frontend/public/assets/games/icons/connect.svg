<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Drop Shadow for Board Container -->
    <filter id="boardShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <!-- Drop Shadow for Pipes and Endpoints -->
    <filter id="pipeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.35"/>
    </filter>

    <!-- Top Highlight Gradient for 3D Endpoint Effect (Matching connect-board.component.ts) -->
    <linearGradient id="endpointHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Cell divider grid pattern -->
    <pattern id="gridPattern" width="90" height="90" patternUnits="userSpaceOnUse">
      <rect width="90" height="90" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.5"/>
    </pattern>
  </defs>

  <!-- 1. Outer Board Container (Matching app-connect-board Card Style) -->
  <g filter="url(#boardShadow)">
    <rect x="25" y="25" width="450" height="450" rx="40" fill="#0f172a"/>
    <rect x="25" y="25" width="450" height="450" rx="40" fill="none" stroke="#334155" stroke-width="5"/>
  </g>

  <!-- 2. Inner Grid Area (5x5 Grid, cell size 85x85, origin at 37.5, 37.5) -->
  <g transform="translate(37.5, 37.5)">
    <!-- Grid Cell Outlines -->
    <rect x="0" y="0" width="425" height="425" rx="20" fill="#1e293b"/>
    
    <!-- Cell Grid Dividers -->
    <line x1="85" y1="0" x2="85" y2="425" stroke="#334155" stroke-width="2" opacity="0.6"/>
    <line x1="170" y1="0" x2="170" y2="425" stroke="#334155" stroke-width="2" opacity="0.6"/>
    <line x1="255" y1="0" x2="255" y2="425" stroke="#334155" stroke-width="2" opacity="0.6"/>
    <line x1="340" y1="0" x2="340" y2="425" stroke="#334155" stroke-width="2" opacity="0.6"/>

    <line x1="0" y1="85" x2="425" y2="85" stroke="#334155" stroke-width="2" opacity="0.6"/>
    <line x1="0" y1="170" x2="425" y2="170" stroke="#334155" stroke-width="2" opacity="0.6"/>
    <line x1="0" y1="255" x2="425" y2="255" stroke="#334155" stroke-width="2" opacity="0.6"/>
    <line x1="0" y1="340" x2="425" y2="340" stroke="#334155" stroke-width="2" opacity="0.6"/>

    <!-- Small Grey Square Dots for Empty Spots (Matching connect-board grey square dots) -->
    <!-- Column centers: 42.5, 127.5, 212.5, 297.5, 382.5 -->
    <!-- Row centers: 42.5, 127.5, 212.5, 297.5, 382.5 -->
    <rect x="34.5" y="119.5" width="16" height="16" rx="3.5" fill="#64748b" opacity="0.45"/>
    <rect x="34.5" y="289.5" width="16" height="16" rx="3.5" fill="#64748b" opacity="0.45"/>
    <rect x="374.5" y="119.5" width="16" height="16" rx="3.5" fill="#64748b" opacity="0.45"/>
    <rect x="374.5" y="204.5" width="16" height="16" rx="3.5" fill="#64748b" opacity="0.45"/>
    <rect x="204.5" y="204.5" width="16" height="16" rx="3.5" fill="#64748b" opacity="0.45"/>

    <!-- 3. Connected Pipes (Solid, Vibrant, 100% Matching In-Game Orthogonal Polyline Pipes) -->
    <g filter="url(#pipeShadow)">
      <!-- Pipe 1: Red (#b52025) Connecting (42.5, 42.5) -> (127.5, 42.5) -> (127.5, 212.5) -> (42.5, 212.5) -> (42.5, 382.5) -> (127.5, 382.5) -->
      <polyline points="42.5,42.5 127.5,42.5 127.5,212.5 42.5,212.5 42.5,382.5 127.5,382.5" 
                fill="none" stroke="#b52025" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- Pipe 2: Yellow (#fed000) Connecting (297.5, 42.5) -> (382.5, 42.5) -> (382.5, 297.5) -> (297.5, 297.5) -> (297.5, 382.5) -->
      <polyline points="297.5,42.5 382.5,42.5 382.5,297.5 297.5,297.5 297.5,382.5" 
                fill="none" stroke="#fed000" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- Pipe 3: Blue (#0000ff) Connecting (212.5, 42.5) -> (212.5, 297.5) -> (127.5, 297.5) -->
      <polyline points="212.5,42.5 212.5,297.5 127.5,297.5" 
                fill="none" stroke="#0000ff" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- Pipe 4: Green (#258f25) Connecting (212.5, 127.5) -> (297.5, 127.5) -> (297.5, 212.5) -->
      <polyline points="212.5,127.5 297.5,127.5 297.5,212.5" 
                fill="none" stroke="#258f25" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- Pipe 5: Orange (#ff8c00) Connecting (212.5, 382.5) -> (382.5, 382.5) -->
      <polyline points="212.5,382.5 382.5,382.5" 
                fill="none" stroke="#ff8c00" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- 4. Endpoints (Circular Dots with Numbers matching in-game connect-board) -->
    <!-- Pair 1: Red Endpoints (42.5, 42.5) and (127.5, 382.5) -->
    <g filter="url(#pipeShadow)">
      <circle cx="42.5" cy="42.5" r="34" fill="#b52025"/>
      <circle cx="42.5" cy="42.5" r="34" fill="url(#endpointHighlight)"/>
      <text x="42.5" y="53" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="900" text-anchor="middle" style="filter: drop-shadow(0 1px 2px rgba(0,0,0,0.5));">1</text>

      <circle cx="127.5" cy="382.5" r="34" fill="#b52025"/>
      <circle cx="127.5" cy="382.5" r="34" fill="url(#endpointHighlight)"/>
      <text x="127.5" y="393" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="900" text-anchor="middle" style="filter: drop-shadow(0 1px 2px rgba(0,0,0,0.5));">1</text>
    </g>

    <!-- Pair 2: Yellow Endpoints (297.5, 42.5) and (297.5, 382.5) -->
    <g filter="url(#pipeShadow)">
      <circle cx="297.5" cy="42.5" r="34" fill="#fed000"/>
      <circle cx="297.5" cy="42.5" r="34" fill="url(#endpointHighlight)"/>
      <text x="297.5" y="53" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="900" text-anchor="middle" style="filter: drop-shadow(0 1px 2px rgba(0,0,0,0.6));">2</text>

      <circle cx="297.5" cy="382.5" r="34" fill="#fed000"/>
      <circle cx="297.5" cy="382.5" r="34" fill="url(#endpointHighlight)"/>
      <text x="297.5" y="393" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="900" text-anchor="middle" style="filter: drop-shadow(0 1px 2px rgba(0,0,0,0.6));">2</text>
    </g>

    <!-- Pair 3: Blue Endpoints (212.5, 42.5) and (127.5, 297.5) -->
    <g filter="url(#pipeShadow)">
      <circle cx="212.5" cy="42.5" r="34" fill="#0000ff"/>
      <circle cx="212.5" cy="42.5" r="34" fill="url(#endpointHighlight)"/>
      <text x="212.5" y="53" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="900" text-anchor="middle" style="filter: drop-shadow(0 1px 2px rgba(0,0,0,0.5));">3</text>

      <circle cx="127.5" cy="297.5" r="34" fill="#0000ff"/>
      <circle cx="127.5" cy="297.5" r="34" fill="url(#endpointHighlight)"/>
      <text x="127.5" y="308" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="900" text-anchor="middle" style="filter: drop-shadow(0 1px 2px rgba(0,0,0,0.5));">3</text>
    </g>

    <!-- Pair 4: Green Endpoints (212.5, 127.5) and (297.5, 212.5) -->
    <g filter="url(#pipeShadow)">
      <circle cx="212.5" cy="127.5" r="34" fill="#258f25"/>
      <circle cx="212.5" cy="127.5" r="34" fill="url(#endpointHighlight)"/>
      <text x="212.5" y="138" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="900" text-anchor="middle" style="filter: drop-shadow(0 1px 2px rgba(0,0,0,0.5));">4</text>

      <circle cx="297.5" cy="212.5" r="34" fill="#258f25"/>
      <circle cx="297.5" cy="212.5" r="34" fill="url(#endpointHighlight)"/>
      <text x="297.5" y="223" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="900" text-anchor="middle" style="filter: drop-shadow(0 1px 2px rgba(0,0,0,0.5));">4</text>
    </g>

    <!-- Pair 5: Orange Endpoints (212.5, 382.5) and (382.5, 382.5) -->
    <g filter="url(#pipeShadow)">
      <circle cx="212.5" cy="382.5" r="34" fill="#ff8c00"/>
      <circle cx="212.5" cy="382.5" r="34" fill="url(#endpointHighlight)"/>
      <text x="212.5" y="393" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="900" text-anchor="middle" style="filter: drop-shadow(0 1px 2px rgba(0,0,0,0.5));">5</text>

      <circle cx="382.5" cy="382.5" r="34" fill="#ff8c00"/>
      <circle cx="382.5" cy="382.5" r="34" fill="url(#endpointHighlight)"/>
      <text x="382.5" y="393" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="900" text-anchor="middle" style="filter: drop-shadow(0 1px 2px rgba(0,0,0,0.5));">5</text>
    </g>
  </g>
</svg>